# ============================================================================
# CONFIGURAÇÃO PARA APACHE EM CONTAINER (host 10.10.2.30)
#
# Upstreams Docker (mesma rede):
# - Frontend: r-agent2-frontend-prod:80
# - API: r-agent2-api-prod:3000
#
# Adicione estas linhas dentro do VirtualHost :443 do domínio results.com.br.
# Ordem importa: WebSocket/API -> assets/images -> catch-all /r-agent2.
# ============================================================================

# WebSocket do r-agent2 (tempo real)
ProxyPass        "/r-agent2/ws"      "ws://r-agent2-api-prod:3000/api/ws"
ProxyPassReverse "/r-agent2/ws"      "ws://r-agent2-api-prod:3000/api/ws"
ProxyPass        "/r-agent2/api/ws"  "ws://r-agent2-api-prod:3000/api/ws"
ProxyPassReverse "/r-agent2/api/ws"  "ws://r-agent2-api-prod:3000/api/ws"

# API HTTP do r-agent2
ProxyPass        "/r-agent2/api/"  "http://r-agent2-api-prod:3000/api/" nocanon
ProxyPassReverse "/r-agent2/api/"  "http://r-agent2-api-prod:3000/api/"

# Assets do r-agent2 (arquivos JS, CSS, etc.)
ProxyPass        "/r-agent2/assets/"  "http://r-agent2-frontend-prod:80/assets/" nocanon
ProxyPassReverse "/r-agent2/assets/"  "http://r-agent2-frontend-prod:80/assets/"

# Imagens do r-agent2
ProxyPass        "/r-agent2/images/"  "http://r-agent2-frontend-prod:80/images/" nocanon
ProxyPassReverse "/r-agent2/images/"  "http://r-agent2-frontend-prod:80/images/"

# Rota principal para r-agent2 (frontend SPA)
ProxyPass        "/r-agent2/"  "http://r-agent2-frontend-prod:80/" nocanon
ProxyPassReverse "/r-agent2/"  "http://r-agent2-frontend-prod:80/"

# Garante que os cookies e headers sejam preservados
# IMPORTANTE: Isso ajusta o caminho dos cookies para funcionar corretamente com o prefixo /r-agent2/
ProxyPassReverseCookiePath "/" "/r-agent2/"

# NOTA: Não são necessárias linhas ProxyPassReverse para /login, /dashboard, /support porque:
# - O frontend é uma SPA React que usa redirecionamentos JavaScript (não HTTP)
# - Não há redirecionamentos HTTP do servidor (301/302) para essas rotas
# - O script JavaScript injetado no nginx já corrige os redirecionamentos via pushState
# 
# IMPORTANTE: O nginx do frontend foi configurado para reescrever URLs de assets no HTML
# de /assets/ para /r-agent2/assets/ usando sub_filter, então os assets serão
# corretamente proxyados apenas quando vierem de requisições do r-agent2

# ============================================================================
# Se o Apache não estiver na mesma rede Docker do stack r-agent2, use fallback:
# - Frontend via host: http://10.10.2.30:8086
# - API via host:      http://10.10.2.30:3001
# ============================================================================

