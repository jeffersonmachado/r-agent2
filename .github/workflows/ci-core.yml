name: CI Core [OFICIAL]

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/r_agent2
      RUNTIME_ROOT: /tmp/ragent2-runtime-ci
      SYSTEM_VALIDATE_SKIP_SMOKE_PILLARS: 'true'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r_agent2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d r_agent2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.19.0, 22.12.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Bootstrap oficial
        run: npm run system:bootstrap

      - name: Validate oficial
        run: npm run system:validate

      - name: Upload runtime/governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-core-reports-${{ matrix.node-version }}
          path: |
            qa/system-validate-report.json
            qa/runtime-governance-report.json
            qa/go-no-go-report.json
            qa/release-gate-report.json
            qa/smoke-evidence.json
          retention-days: 7
          if-no-files-found: ignore
