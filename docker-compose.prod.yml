# Docker Compose para PRODUÇÃO
# Uso: docker-compose -f docker-compose.prod.yml up -d

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    image: r-agent2-api:latest
    container_name: r-agent2-api-prod
    environment:
      NODE_ENV: production
      # Porta interna do container (deve bater com o EXPOSE/healthcheck internos)
      API_PORT: 3000
      # DEFAULT_TENANT_ID removido - tenant deve ser fornecido via autenticação
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Políticas de rate limiting
      RATE_LIMIT_DRY_RUN_POINTS: ${RATE_LIMIT_DRY_RUN_POINTS:-50}
      RATE_LIMIT_DRY_RUN_DURATION: ${RATE_LIMIT_DRY_RUN_DURATION:-60}
      RATE_LIMIT_GENERATION_POINTS: ${RATE_LIMIT_GENERATION_POINTS:-5}
      RATE_LIMIT_GENERATION_DURATION: ${RATE_LIMIT_GENERATION_DURATION:-60}
      RATE_LIMIT_BOOTSTRAP_POINTS: ${RATE_LIMIT_BOOTSTRAP_POINTS:-1}
      RATE_LIMIT_BOOTSTRAP_DURATION: ${RATE_LIMIT_BOOTSTRAP_DURATION:-300}
      RATE_LIMIT_SCRAPING_POINTS: ${RATE_LIMIT_SCRAPING_POINTS:-10}
      RATE_LIMIT_SCRAPING_DURATION: ${RATE_LIMIT_SCRAPING_DURATION:-300}
      RATE_LIMIT_SCRAPING_RPS: ${RATE_LIMIT_SCRAPING_RPS:-3}
      RATE_LIMIT_SCRAPING_PAGES: ${RATE_LIMIT_SCRAPING_PAGES:-20}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag-service:8000}
      RAG_INTERNAL_TOKEN: "${RAG_INTERNAL_TOKEN:?RAG_INTERNAL_TOKEN obrigatória}"
      # PostgreSQL - Configuração de produção
      # PROD_DATABASE_URL dedicada: o DATABASE_URL do .env de dev aponta para
      # localhost e vazaria para o container; credenciais alinhadas ao serviço
      # postgres abaixo (POSTGRES_USER/PASSWORD/DB).
      DATABASE_URL: ${PROD_DATABASE_URL:-postgresql://${POSTGRES_USER:-results_app}:${POSTGRES_PASSWORD:-StrongPass}@postgres:5432/${POSTGRES_DB:-results_saas}}
      PGHOST: ${PGHOST:-postgres}
      PGUSER: ${POSTGRES_USER:-results_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-StrongPass}
      PGDATABASE: ${POSTGRES_DB:-results_saas}
      PGPORT: ${PGPORT:-5432}
      # Criptografia de segredos (OBRIGATÓRIO em produção)
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY obrigatória}"
      # -------------------------------------------------------------------
      # Bootstrap de usuários (criados automaticamente pelo seed)
      # -------------------------------------------------------------------
      # Admin (tenant "system")
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@exemplo.com}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      # Recomenda-se definir explicitamente no .env do servidor remoto
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Erro: ADMIN_PASSWORD não definida}"
      # SystemAdmin (super-admin global)
      SYSTEMADMIN_USERNAME: ${SYSTEMADMIN_USERNAME:-systemadmin}
      SYSTEMADMIN_EMAIL: ${SYSTEMADMIN_EMAIL:-systemadmin@exemplo.com}
      SYSTEMADMIN_NAME: ${SYSTEMADMIN_NAME:-System Admin}
      # Recomenda-se definir explicitamente no .env do servidor remoto
      SYSTEMADMIN_PASSWORD: "${SYSTEMADMIN_PASSWORD:?Erro: SYSTEMADMIN_PASSWORD não definida}"
      # OpenAI API Key (opcional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WWEBJS_AUTH_PATH: ${WWEBJS_AUTH_PATH:-/var/lib/ragent2/whatsapp/auth}
      QA_MESH_DISABLE_SCHEDULER: '1'
      QA_MESH_HISTORY_DIR: ${QA_MESH_HISTORY_DIR:-/var/lib/ragent2/qa-mesh/history}
      QA_MESH_EVIDENCE_DIR: ${QA_MESH_EVIDENCE_DIR:-/var/lib/ragent2/qa-mesh/evidence}
      QA_MESH_SYSTEM_VALIDATE_DIR: ${QA_MESH_SYSTEM_VALIDATE_DIR:-/var/lib/ragent2/qa-mesh/system-validate}
      RELEASE_EVIDENCE_BASE_DIR: ${RELEASE_EVIDENCE_BASE_DIR:-/var/lib/ragent2/release-evidence}
      # Configurações adicionais de produção
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # -------------------------------------------------------------------
      # Webhook Secrets (fail-closed: sem secret = webhook rejeitado em produção)
      # -------------------------------------------------------------------
      WHATSAPP_QR_WEBHOOK_SECRET: ${WHATSAPP_QR_WEBHOOK_SECRET:-}
      # INSTAGRAM_APP_SECRET e MESSENGER_APP_SECRET: obter no Meta Developer Dashboard
      # (App > Configurações > Básico > App Secret). Sem eles, webhooks do Meta são rejeitados.
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      MESSENGER_APP_SECRET: ${MESSENGER_APP_SECRET:-}
      # -------------------------------------------------------------------
      # PBX v1 (Asterisk Realtime/ODBC + AMI)
      # -------------------------------------------------------------------
      AMI_HOST: ${AMI_HOST:-asterisk}
      AMI_PORT: ${AMI_PORT:-5038}
      AMI_USERNAME: ${AMI_USERNAME:-ragent2}
      AMI_SECRET: "${AMI_SECRET:?Erro: AMI_SECRET não definida}"
      AMI_ORIGINATE_ENABLED: ${AMI_ORIGINATE_ENABLED:-false}
      PBX_MEDIA_DIR: ${PBX_MEDIA_DIR:-/app/api/data/pbx-media}
      PBX_RECORDINGS_DIR: ${PBX_RECORDINGS_DIR:-/app/api/data/pbx-recordings}
      PBX_RECORDING_ENABLED: ${PBX_RECORDING_ENABLED:-false}
      PBX_MIXMONITOR_DIR: ${PBX_MIXMONITOR_DIR:-/var/spool/asterisk/monitor/pbx}
    ports:
      # Porta exposta no host (externa) -> porta interna do container (3000)
      - "${API_PUBLIC_PORT:-3001}:3000"
    volumes:
      # Persistência de dados
      - r-agent2-api-data:/app/api/data
      - r-agent2-runtime:/var/lib/ragent2
      - r-agent2-pbx-media-data:/app/api/data/pbx-media
      - r-agent2-pbx-recordings-data:/app/api/data/pbx-recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      asterisk:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - r-agent2-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/r-agent2/}
    image: r-agent2-frontend:latest
    container_name: r-agent2-frontend-prod
    environment:
      NODE_ENV: production
      # VITE_API_BASE_URL aponta para o backend atrás do prefixo /r-agent2/api
      # Externo: https://results.com.br/r-agent2/api
      # Interno (nginx): /api
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/r-agent2/api}
    ports:
      - "${FRONTEND_PORT:-8086}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - r-agent2-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  rag-service:
    build:
      context: ./rag-service
      dockerfile: ./Dockerfile
    image: r-agent2-rag-service:latest
    container_name: r-agent2-rag-service-prod
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      RAG_ENVIRONMENT: production
      RAG_INTERNAL_TOKEN: "${RAG_INTERNAL_TOKEN:?RAG_INTERNAL_TOKEN obrigatória}"
      DEBUG: ${RAG_DEBUG:-false}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      RAG_EMBEDDING_BACKEND: ${RAG_EMBEDDING_BACKEND:-onnx}
      CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      CHUNK_STRATEGY: ${RAG_CHUNK_STRATEGY:-sentence}
      VECTOR_STORE_TYPE: ${RAG_VECTOR_STORE_TYPE:-postgres}
      RAG_DATA_ROOT: ${RAG_DATA_ROOT:-/var/lib/ragent2/rag}
      VECTOR_STORE_PATH: ${VECTOR_STORE_PATH:-/var/lib/ragent2/rag/vector_store}
      ADAPTIVE_LEARNING_DATA_PATH: ${ADAPTIVE_LEARNING_DATA_PATH:-/var/lib/ragent2/rag/adaptive_learning}
      LLM_PROVIDER: ${RAG_LLM_PROVIDER:-openai}
      LLM_MODEL: ${RAG_LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: ${PROD_DATABASE_URL:-postgresql://${POSTGRES_USER:-results_app}:${POSTGRES_PASSWORD:-StrongPass}@postgres:5432/${POSTGRES_DB:-results_saas}}
    expose:
      - "8000"
    volumes:
      - r-agent2-rag-data:/var/lib/ragent2/rag
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - r-agent2-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # warm-up do modelo de embeddings pode levar >60s; sem start_period o
      # compose marca unhealthy durante a subida e aborta o `up` do stack
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  postgres:
    image: pgvector/pgvector:pg16
    container_name: r-agent2-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-results_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongPass}
      POSTGRES_DB: ${POSTGRES_DB:-results_saas}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Configurações de performance para produção
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Configurações de segurança
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5433}:5432"
    volumes:
      - r-agent2-postgres-data:/var/lib/postgresql/data
      # Scripts de inicialização (opcional)
      # - ./scripts/postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    logging: *default-logging
    networks:
      - r-agent2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Configurações adicionais de segurança e performance
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=100
      -c log_statement=ddl
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c log_timezone=America/Sao_Paulo
      -c timezone=America/Sao_Paulo

  asterisk:
    build:
      context: ./pbx/asterisk
      dockerfile: ./Dockerfile
    image: r-agent2-asterisk:latest
    container_name: r-agent2-asterisk-prod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pbx/asterisk/etc/asterisk:/etc/asterisk:ro
      - ./pbx/asterisk/etc/odbc.ini:/etc/odbc.ini:ro
      - ./pbx/asterisk/etc/odbcinst.ini:/etc/odbcinst.ini:ro
      - r-agent2-pbx-media-data:/var/lib/asterisk/sounds/pbx
      - r-agent2-pbx-recordings-data:/var/spool/asterisk/monitor/pbx
    command: sh -c "asterisk -f -vvvvv -d"
    ports:
      - "${AMI_PUBLIC_PORT:-5038}:5038"
      - "${SIP_UDP_PORT:-5060}:5060/udp"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - r-agent2-network
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    build:
      context: ./redis
      dockerfile: ./Dockerfile
    image: r-agent2-redis:latest
    container_name: r-agent2-redis-prod
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - r-agent2-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    logging: *default-logging
    networks:
      - r-agent2-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  r-agent2-postgres-data:
  r-agent2-redis-data:
  r-agent2-api-data:
  r-agent2-runtime:
  r-agent2-pbx-media-data:
  r-agent2-pbx-recordings-data:
  r-agent2-rag-data:

networks:
  r-agent2-network:
    driver: bridge
