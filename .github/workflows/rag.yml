name: RAG Service Tests

# =============================================================================
# Suíte pytest do rag-service (FastAPI + sentence-transformers, torch CPU).
#
# Receita validada localmente com venv zerado (pip install do zero,
# torch==2.2.2+cpu): 30/30 testes verdes. Não exige Postgres — os testes
# usam vector store em disco (VECTOR_STORE_PATH isolado pelo conftest).
# O modelo all-MiniLM-L6-v2 é baixado do HuggingFace na 1ª execução
# (cacheado entre runs).
# =============================================================================

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# IMAGEM DE RUNNER FIXA (política do repositório desde 2026-10-26): `ubuntu-latest` passou a resolver
# para ubuntu-26.04 e quebra a validação por AMBIENTE, não por código — `npx playwright install
# --with-deps chromium` morre com "Playwright does not support chromium on ubuntu26.04-x64" e o systemd
# do 26.04 mudou a redação de diagnósticos que suítes nossas asseveram. Medido no run 40303567233/40303874392
# (dev-branch-ci). Imagem fixa até que Playwright e as asserções de mensagem suportem 26.04.
jobs:
  rag-pytest:
    name: "RAG pytest (30 testes)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rag-service/requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('rag-service/requirements.txt') }}
          restore-keys: hf-models-

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: rag-service

      - name: Run pytest
        run: python -m pytest -q
        working-directory: rag-service
        env:
          CI: true
