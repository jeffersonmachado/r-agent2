name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Alinhado com package.json engines:
        # node: ">=20.19.0 || >=22.12.0"
        node-version: [20.19.0, 22.12.0]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright (Chromium)
      run: npx playwright install chromium --with-deps
    
    - name: Start Frontend (Vite) and run official system validation
      run: |
        cleanup() {
          kill "${VITE_PID:-}" 2>/dev/null || true
        }
        trap cleanup EXIT
        cd frontend
        npm ci
        npm run start -- --host 0.0.0.0 --port 5173 --strictPort &
        VITE_PID=$!
        cd ..
        node -e "const http=require('http'); const url='http://127.0.0.1:5173'; let tries=60; (function ping(){ http.get(url,res=>{process.exit(0)}).on('error',()=>{ if(--tries<=0) process.exit(1); setTimeout(ping,1000); });})();"
        npm run system:validate
    
    - name: Upload RPA reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rpa-reports-${{ matrix.node-version }}
        path: tests/rpa/reports/
        retention-days: 7

  operational-agent-shim-strict:
    name: Operational Agent Shim Strict (staging rollout)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    continue-on-error: ${{ vars.OPERATIONAL_AGENT_SHIM_STRICT_ENFORCE != '1' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 20.19.0
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run strict shim compatibility checks
      env:
        OPERATIONAL_AGENT_SHIM_STRICT: '1'
        REDIS_URL: redis://localhost:6379
        SEQUELIZE_LOGGING: 'false'
      run: |
        npx jest --runInBand \
          api/core/operational-agent/__tests__/OperationalAgentShimDeprecation.test.js \
          api/core/operational-agent/__tests__/OperationalAgentIndex.test.js

    - name: Add rollout summary
      if: always()
      run: |
        echo "### Operational-agent strict shim rollout" >> $GITHUB_STEP_SUMMARY
        echo "- Scope: develop + pull_request" >> $GITHUB_STEP_SUMMARY
        echo "- Mode: OPERATIONAL_AGENT_SHIM_STRICT=1" >> $GITHUB_STEP_SUMMARY
        echo "- Enforcement var: OPERATIONAL_AGENT_SHIM_STRICT_ENFORCE=${{ vars.OPERATIONAL_AGENT_SHIM_STRICT_ENFORCE || '0' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Policy: continue-on-error=${{ vars.OPERATIONAL_AGENT_SHIM_STRICT_ENFORCE != '1' }}" >> $GITHUB_STEP_SUMMARY
