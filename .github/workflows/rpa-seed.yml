# WORKFLOW: Seed manual da plataforma via RPA.
name: Seed Plataforma via RPA

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para executar seed'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - test
      test_base_url:
        description: 'URL base da API para o seed'
        required: false
        default: 'http://localhost:3000'
      test_frontend_url:
        description: 'URL do frontend para o seed'
        required: false
        default: 'http://localhost:5173'
      test_admin_email:
        description: 'Email administrativo usado no seed'
        required: false
        default: 'admin@example.com'
      test_admin_password:
        description: 'Senha administrativa usada no seed'
        required: false
        default: ''

jobs:
  seed-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Instalar Playwright
        run: npx playwright install chromium --with-deps
      
      - name: Iniciar servidor (se necessário)
        run: |
          npm run start:api &
          sleep 10
        continue-on-error: true
      
      - name: Executar Seed via RPA
        env:
          TEST_BASE_URL: ${{ github.event.inputs.test_base_url }}
          TEST_FRONTEND_URL: ${{ github.event.inputs.test_frontend_url }}
          TEST_ADMIN_EMAIL: ${{ github.event.inputs.test_admin_email }}
          TEST_ADMIN_PASSWORD: ${{ github.event.inputs.test_admin_password }}
        run: |
          node tests/rpa/seedPlatformRPA.js
        continue-on-error: false
      
      - name: Upload relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-seed-reports
          path: tests/rpa/reports/*.json
          retention-days: 30
      
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-seed-screenshots
          path: tests/rpa/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Upload replays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-seed-replays
          path: tests/rpa/replay/*.json
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Resumo da execução
        if: always()
        run: |
          echo "## 🌱 Resumo do Seed RPA" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ambiente:** ${{ inputs.environment || 'development' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Artifacts gerados:" >> $GITHUB_STEP_SUMMARY
          echo "- Relatórios JSON" >> $GITHUB_STEP_SUMMARY
          echo "- Screenshots (se houver erros)" >> $GITHUB_STEP_SUMMARY
          echo "- Replays da execução" >> $GITHUB_STEP_SUMMARY

