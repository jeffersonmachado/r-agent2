[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: Testes unitários
    integration: Testes de integração
    slow: Testes que demoram mais tempo

