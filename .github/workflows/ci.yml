name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/r_agent2

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r_agent2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d r_agent2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    strategy:
      matrix:
        # Alinhado com package.json engines:
        # node: ">=20.19.0 || >=22.12.0"
        node-version: [20.19.0, 22.12.0]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright (Chromium)
      run: npx playwright install chromium --with-deps
    
    - name: Start Frontend (Vite) and run official system validation
      run: |
        cleanup() {
          kill "${VITE_PID:-}" 2>/dev/null || true
        }
        trap cleanup EXIT
        cd frontend
        npm ci
        npm run start -- --host 0.0.0.0 --port 5173 --strictPort &
        VITE_PID=$!
        cd ..
        node -e "const http=require('http'); const url='http://127.0.0.1:5173'; let tries=60; (function ping(){ http.get(url,res=>{process.exit(0)}).on('error',()=>{ if(--tries<=0) process.exit(1); setTimeout(ping,1000); });})();"
        npm run system:validate

    - name: Scheduling support API smoke (non-blocking)
      continue-on-error: true
      env:
        API_BASE_URL: http://127.0.0.1:3001
        TEST_TENANT_ID: tenant-demo
        SMOKE_SKIP_IF_API_UNREACHABLE: 'true'
      run: npm run test:scheduling-support:smoke

    - name: Upload scheduling support smoke report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scheduling-support-smoke-${{ matrix.node-version }}
        path: /tmp/scheduling_support_smoke_report.md
        retention-days: 7
        if-no-files-found: ignore

    - name: Summarize scheduling support smoke
      if: always()
      run: |
        echo "## Scheduling Support Smoke" >> "$GITHUB_STEP_SUMMARY"
        if [ -f /tmp/scheduling_support_smoke_report.md ]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/scheduling_support_smoke_report.md >> "$GITHUB_STEP_SUMMARY"
        else
          echo "- Report not generated." >> "$GITHUB_STEP_SUMMARY"
        fi
    
    - name: Upload RPA reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rpa-reports-${{ matrix.node-version }}
        path: tests/rpa/reports/
        retention-days: 7
