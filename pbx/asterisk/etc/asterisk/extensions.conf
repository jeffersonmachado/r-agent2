[general]
static=yes
writeprotect=no
clearglobalvars=no

; Realtime dialplan per tenant context.
; IMPORTANT: Asterisk requires explicit contexts to use the Realtime switch.
; For SaaS multi-tenant, add one section per tenant_key.

; Contextos por tenant gerados a partir da tabela `extensions` (coluna `context`).
; `#tryinclude` (e não `#include`) para que a ausencia do arquivo nao impeca o
; Asterisk de subir — o arquivo e' produzido pelo gerador de dialplan da aplicacao.
#tryinclude conf/tenants.conf

[system]
switch => Realtime/system@extensions

; Example:
; [tenant1]
; switch => Realtime/tenant1@extensions

