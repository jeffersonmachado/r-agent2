server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Evita 413 no proxy do frontend antes de encaminhar o upload para a API.
    client_max_body_size 50m;

    # WebSocket da API com prefixo /r-agent2/api
    location ~ ^/r-agent2/api/ws$ {
        rewrite ^/r-agent2/api/ws$ /ws break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # WebSocket da API sem prefixo (compatibilidade)
    location = /api/ws {
        rewrite ^/api/ws$ /ws break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Auth com prefixo /r-agent2/api (ex.: /r-agent2/api/auth/login)
    location ~ ^/r-agent2/api/auth/ {
        rewrite ^/r-agent2/api/auth/(.*)$ /auth/$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Auth sem prefixo (compatibilidade)
    location ~ ^/api/auth/ {
        rewrite ^/api/auth/(.*)$ /auth/$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para API com prefixo /r-agent2/api.
    # Regra: remove exatamente o prefixo /r-agent2/api UMA vez.
    # Exemplos:
    # - /r-agent2/api/tickets -> /tickets
    # - /r-agent2/api/api/tenant-settings/x -> /api/tenant-settings/x
    # Evita fallback SPA para /r-agent2/api (sem barra final).
    location = /r-agent2/api {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /r-agent2/api;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ ^/r-agent2/api/ {
        rewrite ^/r-agent2/api/(.*)$ /$1 break;
        # Dentro do network do docker-compose, a API escuta em 3000.
        # 3001 é apenas a porta publicada no host (ports: 3001:3000).
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /r-agent2/api;
        proxy_cache_bypass $http_upgrade;
    }

    # Quando o proxy externo já removeu /r-agent2, algumas chamadas chegam como /api/api/*.
    # Normaliza para /api/* (remove um único /api extra).
    location ~ ^/api/api/ {
        rewrite ^/api/api/(.*)$ /api/$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Rotas que são realmente /api/* no backend (preserva /api)
    location ~ ^/api/(pbx|pbx-legacy|cc|marketing|crm|ops|executions|voice|event-ledger|tenant-settings|support|backup|node-marketplace|solutions|physical|orders)(/.*)?$ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para API sem prefixo (compatibilidade local / edge)
    # Para rotas legadas que no backend são /tickets, /queues, /segmentation, etc.,
    # mas chegam como /api/* após remoção do /r-agent2 no proxy externo.
    # Evita fallback SPA para /api (sem barra final).
    location = /api {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ ^/api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_cache_bypass $http_upgrade;
    }

    # Mídias públicas de WhatsApp devem ser servidas pela API,
    # não pelo diretório estático do frontend.
    location ~ ^(/r-agent2)?/public/whatsapp-media(/.*)?$ {
        rewrite ^/r-agent2/(.*)$ /$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket da API em /ws (o frontend conecta por padrão em /r-agent2/ws)
    location ~ ^(/r-agent2)?/ws$ {
        rewrite ^(/r-agent2)?/ws$ /ws break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Proxy para rotas de autenticação (/auth/*) - aceita com ou sem prefixo /r-agent2
    location ~ ^(/r-agent2)?/auth/ {
        # Remove prefixo /r-agent2 se presente antes de fazer proxy
        rewrite ^/r-agent2/auth/(.*)$ /auth/$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para rotas específicas da API que não começam com /api/
    # IMPORTANTE: Não incluir rotas do frontend React (como /dev, /dashboard, /support, etc.)
    # Apenas rotas que realmente existem na API backend
    
    # Proxy para /dev/files/* (API de arquivos de desenvolvimento) - aceita com ou sem prefixo /r-agent2
    location ~ ^(/r-agent2)?/dev/files {
        rewrite ^(/r-agent2)?/dev/files(.*)$ /dev/files$2 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para outras rotas da API que não começam com /api/
    # Captura rotas como /flows/validate, /tenants/123/context, /super-admin/tenants, etc.
    # Aceita tanto com prefixo /r-agent2 quanto sem (para funcionar com Apache proxy)
    # Exclui rotas do frontend: /dev (sem /files), /dashboard, /support, /editor, etc.
    # IMPORTANTE: incluir também rotas de super-admin para que o painel de Super Admin funcione.
    location ~ ^(/r-agent2)?/(super-admin|tenants|audit|flows|conversations|tickets|queues|system|admin|rpa-tests|replay|health|version|metrics|quick-replies|departments|bulk-messaging|analytics|export|ai-tools|segmentation|whatsapp-templates|knowledge-base|product-docs|rag|rag-documents|web-scraping|qa|webhooks|config|whatsapp|push)(/.*)?$ {
        # Remove o prefixo /r-agent2 se presente antes de fazer proxy
        rewrite ^/r-agent2/(.*)$ /$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Arquivos estáticos
    # Assets com prefixo /r-agent2/ (build Vite base=/r-agent2/): o Apache
    # canônico já faz ProxyPass /r-agent2/assets -> /assets antes de chegar
    # aqui, mas no compose local o nginx é exposto diretamente (sem Apache),
    # então reescreve o prefixo para servir /usr/share/nginx/html/assets.
    # Cobre também os artefatos PWA na raiz do dist (sw.js, workbox, manifest).
    location ~ ^/r-agent2/(assets|images|icons|favicon\.(ico|svg|png)|manifest\.webmanifest|sw\.js|pwa-webpush-sw\.js|workbox-[^/]+\.js|features\.json) {
        rewrite ^/r-agent2/(.*)$ /$1 break;
    }

    location / {
        try_files $uri $uri/ /index.html;
        
        # Desabilita cache para HTML (garante que sempre pegue a versão mais recente)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Reescreve URLs de assets no HTML para incluir o prefixo /r-agent2/
        # IMPORTANTE: URLs relativas começando com / são resolvidas em relação à raiz do domínio
        # Então /assets/xxx.js vira https://results.com.br/assets/xxx.js (ERRADO)
        # Precisamos reescrever para /r-agent2/assets/xxx.js (CORRETO)
        sub_filter 'src="/assets/' 'src="/r-agent2/assets/';
        sub_filter 'href="/assets/' 'href="/r-agent2/assets/';
        sub_filter '"/assets/' '"/r-agent2/assets/';
        sub_filter "src='/assets/" "src='/r-agent2/assets/";
        sub_filter "href='/assets/" "href='/r-agent2/assets/";
        sub_filter "'/assets/" "'/r-agent2/assets/";
        # Reescreve URLs de imagens também
        sub_filter 'src="/images/' 'src="/r-agent2/images/';
        sub_filter 'href="/images/' 'href="/r-agent2/images/';
        sub_filter '"/images/' '"/r-agent2/images/';
        sub_filter "src='/images/" "src='/r-agent2/images/";
        sub_filter "href='/images/" "href='/r-agent2/images/";
        sub_filter "'/images/" "'/r-agent2/images/";
        # Reescreve favicon também (padrão mais genérico)
        sub_filter 'href="/favicon' 'href="/r-agent2/favicon';
        sub_filter "href='/favicon" "href='/r-agent2/favicon";
        # Captura qualquer href="/ que não seja /r-agent2/ (para outros recursos)
        # Mas apenas se não começar com /r-agent2/ ou /api/ ou /ws
        sub_filter_once off;  # Permite múltiplas substituições
        # sub_filter_types text/html removido - text/html é o padrão do nginx
        
        # Injeta script apenas para corrigir rotas de navegação (pushState, pathname)
        # As APIs já usam URLs relativas e são resolvidas pelo nginx
        sub_filter '</head>' '<script>
(function() {
    const BASE_PATH = "/r-agent2";
    if (window.location.pathname.startsWith(BASE_PATH)) {
        // Corrige rotas de navegação
        const op = window.history.pushState;
        window.history.pushState = function(s, t, u) {
            if (u && typeof u === "string" && u.startsWith("/") && !u.startsWith(BASE_PATH)) {
                u = BASE_PATH + u;
            }
            return op.call(window.history, s, t, u);
        };
        // Ajusta pathname para o React (remove prefixo quando lido)
        try {
            const ol = Object.getOwnPropertyDescriptor(window.location, "pathname");
            if (ol) {
                Object.defineProperty(window.location, "pathname", {
                    get: function() {
                        const p = ol.get.call(this);
                        return p.startsWith(BASE_PATH) ? p.substring(BASE_PATH.length) || "/" : p;
                    },
                    configurable: true
                });
            }
        } catch(e) {}
    }
})();
</script></head>';
        # sub_filter_once off permite múltiplas substituições (assets + script)
    }

    # Serve config.json sem cache (para permitir atualizações)
    location = /config.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Serve config.json também com prefixo /r-agent2
    location = /r-agent2/config.json {
        try_files /config.json =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache para assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
