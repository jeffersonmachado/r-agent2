name: Release Governance — ENVELOPE + PAYLOAD

# =============================================================================
# Valida a arquitetura minimal-envelope-governed antes de qualquer release.
# Qualquer falha bloqueia: merge, build, release, tag, publish.
#
# Critérios obrigatórios (22):
#  1.  payload existe
#  2.  envelope existe
#  3.  manifest existe
#  4.  SHA256 do payload bate com manifest
#  5.  governance externo aponta para payload correto
#  6.  signatures externas apontam para payload correto
#  7.  verifier offline executa corretamente
#  8.  verify-result.status = PASS
#  9.  self-proving-report.pass = true
#  10. package-validation-report.ok = true
#  11. package-integrity-report.pass = true
#  12. envelopeValidated = true
#  13. payloadValidated = true
#  14. staleReferencesFound = 0
#  15. sem placeholder
#  16. sem transitional
#  17. sem pending
#  18. sem NO_GO
#  19. sem governance stale
#  20. sem signatures stale
#  21. sem verifier stale
#  22. sem referências antigas (banned timestamps)
# =============================================================================

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Ativar modo STRICT (warnings viram FAIL)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      skip_build:
        description: 'Pular build (usar dist/ existente no cache)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  NODE_VERSION_LTS: '20'
  NODE_VERSION_CURRENT: '22'
  RELEASE_GOVERNANCE_STRICT: ${{ github.event.inputs.strict_mode || 'true' }}

jobs:
  # ===========================================================================
  # JOB 1: Build + Validação Core
  # ===========================================================================
  governance-core:
    name: "Governance Core (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Materializar pacotes irmãos @results (fora do checkout)
        run: |
          mkdir -p ../../packages ../packages
          rm -rf ../../packages/auth ../packages/whatsapp-qr-bridge
          cp -r vendor/auth ../../packages/auth
          cp -r vendor/whatsapp-qr-bridge ../packages/whatsapp-qr-bridge
          npm --prefix ../packages/whatsapp-qr-bridge ci --omit=dev --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      # Attestation Ed25519: a chave privada NUNCA está no repositório. Em CI,
      # vem do secret RAP_RELEASE_ATTESTATION_PRIVATE_KEY (PEM base64). Sem o
      # secret configurado, o passo falha — release sem assinatura autenticada
      # não é release (fail-closed, por design).
      - name: Provisionar chave de attestation Ed25519 (runtime root, fora do checkout)
        run: |
          KEY_DIR="$RUNNER_TEMP/release-keys"
          mkdir -p "$KEY_DIR" && chmod 700 "$KEY_DIR"
          if [[ -z "${RAP_RELEASE_ATTESTATION_PRIVATE_KEY_B64}" ]]; then
            echo "ERRO: secret RAP_RELEASE_ATTESTATION_PRIVATE_KEY não configurado — attestation Ed25519 é obrigatório"
            exit 1
          fi
          printf '%s' "${RAP_RELEASE_ATTESTATION_PRIVATE_KEY_B64}" | base64 -d > "$KEY_DIR/release-attestation-private.pem"
          chmod 600 "$KEY_DIR/release-attestation-private.pem"
          node -e "
            const fs=require('fs'), crypto=require('crypto');
            const priv=fs.readFileSync('$KEY_DIR/release-attestation-private.pem','utf8');
            const pub=crypto.createPublicKey(priv).export({type:'spki',format:'pem'});
            fs.writeFileSync('$KEY_DIR/release-attestation-public.pem', pub, {mode:0o644});
          "
          echo "RAP_RELEASE_KEY_DIR=$KEY_DIR" >> "$GITHUB_ENV"
          echo "Chave de attestation provisionada (privada 0600 fora do checkout)"
        env:
          RAP_RELEASE_ATTESTATION_PRIVATE_KEY_B64: ${{ secrets.RAP_RELEASE_ATTESTATION_PRIVATE_KEY }}

      - name: Generate release artifacts
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: npm run zip:release
        env:
          CI: true

      - name: Tornar scripts executáveis
        run: chmod +x scripts/*.sh

      # Coverage Gate bloqueante: política de visibilidade + isolamento de
      # tenant + pisos de cobertura (ratchet). O relatório de tenant é gerado
      # fresco no CI (npm run report:tenant-isolation) — as suítes de
      # integração de tests/tenant se auto-pulam sem PostgreSQL (contam como
      # pending, nunca como falha); o relatório versionado
      # reports/tenant-isolation-report.json (gerado localmente com DB, 60/60)
      # permanece como evidência baseline. COVERAGE_GATE_SKIP_TENANT_RUN=1
      # garante que o gate consome o relatório em disco sem re-executar o Jest.
      - name: "Coverage gate (visibility policy + tenant isolation + ratchet)"
        run: |
          npm run report:tenant-isolation
          npm run validate:visibility-policy
          COVERAGE_GATE_SKIP_TENANT_RUN=1 npm run validate:coverage-gate

      - name: "Upload coverage gate report (diagnóstico)"
        if: always()
        # Diagnóstico: falha de upload (ex.: quota de artifact storage) não pode
        # bloquear a cadeia de verificação [1/6]–[7/7], que é o gate real.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate-report-node${{ matrix.node-version }}
          path: reports/coverage-gate-report.json
          if-no-files-found: ignore

      - name: "[1/6] check-dist-clean"
        run: bash scripts/check-dist-clean.sh

      - name: "[2/6] verify-enterprise-governance (wrapper)"
        run: bash scripts/verify-enterprise-governance.sh

      - name: "[3/6] verify-enterprise-governance-v2 (rígido)"
        run: bash scripts/verify-enterprise-governance-v2.sh

      - name: "[4/6] audit-envelope-release-final (auditoria profunda)"
        run: bash scripts/audit-envelope-release-final.sh

      - name: "[5/7] release-governance-ci (pipeline central)"
        run: bash scripts/release-governance-ci.sh --skip-build --no-offline --json-report
        env:
          RELEASE_GOVERNANCE_STRICT: ${{ env.RELEASE_GOVERNANCE_STRICT }}

      - name: "[6/7] payload contamination regression"
        run: bash scripts/test-payload-contamination-regression.sh

      - name: "[7/7] Verifier offline — extrair envelope e executar verifier"
        run: |
          ENVELOPE="$(ls -t dist/release/*.zip 2>/dev/null | grep -v '\.payload\.zip' | head -1)"
          if [[ -z "$ENVELOPE" ]]; then
            echo "ERRO: envelope não encontrado em dist/release/"
            exit 1
          fi

          TMPDIR_OFFLINE="$(mktemp -d)"
          echo "Extraindo: $ENVELOPE → $TMPDIR_OFFLINE"
          unzip -q "$ENVELOPE" -d "$TMPDIR_OFFLINE"
          ls -la "$TMPDIR_OFFLINE"

          # Detectar path do verifier dentro do envelope extraído
          VERIFIER=""
          if [[ -f "$TMPDIR_OFFLINE/r-agent2/dist/verifier/verify-enterprise-governance.sh" ]]; then
            VERIFIER="$TMPDIR_OFFLINE/r-agent2/dist/verifier/verify-enterprise-governance.sh"
          elif [[ -f "$TMPDIR_OFFLINE/dist/verifier/verify-enterprise-governance.sh" ]]; then
            VERIFIER="$TMPDIR_OFFLINE/dist/verifier/verify-enterprise-governance.sh"
          else
            echo "ERRO: verifier não encontrado no envelope extraído"
            find "$TMPDIR_OFFLINE" -name "verify-enterprise-governance.sh" || true
            rm -rf "$TMPDIR_OFFLINE"
            exit 1
          fi

          chmod +x "$VERIFIER" 2>/dev/null || true
          echo "Executando verifier offline: $VERIFIER"
          bash "$VERIFIER"
          EXIT_CODE=$?
          rm -rf "$TMPDIR_OFFLINE"

          if [[ "$EXIT_CODE" -ne 0 ]]; then
            echo "REPROVADO: verifier offline falhou (exit $EXIT_CODE)"
            exit $EXIT_CODE
          fi
          echo "✓ Verifier offline: PASS"

      - name: Upload artifacts de governança
        if: always()
        # Diagnóstico/auditoria: falha de upload (ex.: quota de artifact storage)
        # não pode bloquear o job — o envelope é re-gerado e verificado offline
        # a partir do próprio checkout. Retenção curta para não estourar quota
        # (cada run envia ~144 MB em ZIPs, 2 versões de Node).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: governance-artifacts-node${{ matrix.node-version }}
          path: |
            dist/release/*.zip
            dist/release/*.payload.zip
            dist/release/*.manifest.json
            dist/governance/*.json
            dist/signatures/*.sig
            dist/verifier/*.json
            dist/ci-logs/ci-governance-audit.log
            dist/ci-logs/ci-governance-report.json
            dist/ci-logs/ci-offline-test.log
          retention-days: 3
          if-no-files-found: warn

  # ===========================================================================
  # JOB 2: Testes de Regressão
  # ===========================================================================
  governance-regression:
    name: "Regression Tests"
    runs-on: ubuntu-latest
    needs: []  # Independente — detecta regressões no próprio CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_LTS }}
          cache: 'npm'

      - name: Materializar pacotes irmãos @results (fora do checkout)
        run: |
          mkdir -p ../../packages ../packages
          rm -rf ../../packages/auth ../packages/whatsapp-qr-bridge
          cp -r vendor/auth ../../packages/auth
          cp -r vendor/whatsapp-qr-bridge ../packages/whatsapp-qr-bridge
          npm --prefix ../packages/whatsapp-qr-bridge ci --omit=dev --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Tornar scripts executáveis
        run: chmod +x scripts/*.sh

      - name: Executar testes de regressão de governança
        run: bash scripts/test-governance-regression.sh
        env:
          RELEASE_GOVERNANCE_STRICT: ${{ env.RELEASE_GOVERNANCE_STRICT }}

      - name: Executar regressão de contaminação de payload
        run: bash scripts/test-payload-contamination-regression.sh

      - name: Upload logs de regressão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-logs
          path: |
            .ci-regression-tests/
          retention-days: 14
          if-no-files-found: warn

  # ===========================================================================
  # JOB 3: Gate de Proteção de Release
  # Bloqueia tag/publish se qualquer validação falhou
  # ===========================================================================
  release-gate:
    name: "Release Gate (bloqueio de tag/publish)"
    runs-on: ubuntu-latest
    needs:
      - governance-core
      - governance-regression
    if: always()

    steps:
      - name: Verificar resultado dos jobs anteriores
        run: |
          CORE_RESULT="${{ needs.governance-core.result }}"
          REGR_RESULT="${{ needs.governance-regression.result }}"

          echo "governance-core: $CORE_RESULT"
          echo "governance-regression: $REGR_RESULT"

          if [[ "$CORE_RESULT" != "success" ]]; then
            echo ""
            echo "REPROVADO: governance-core falhou ($CORE_RESULT)"
            echo "Tag, publish e release BLOQUEADOS."
            exit 1
          fi

          if [[ "$REGR_RESULT" != "success" ]]; then
            echo ""
            echo "REPROVADO: governance-regression falhou ($REGR_RESULT)"
            echo "Tag, publish e release BLOQUEADOS."
            exit 1
          fi

          echo ""
          echo "CI GOVERNANCE HARDENED"
          echo "Todos os gates de governança passaram."
          echo "Release autorizado."
