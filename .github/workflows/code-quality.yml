name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Job 1: Verificação de código (placeholder para lint)
  code-check:
    name: Verificação de Código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Verificar sintaxe JavaScript
        run: |
          echo "🔍 Verificando sintaxe de arquivos JavaScript..."
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./frontend/node_modules/*" -exec node --check {} \; || echo "Alguns arquivos podem ter problemas de sintaxe"
        continue-on-error: true
      
      - name: Verificar arquivos JSON
        run: |
          echo "🔍 Verificando arquivos JSON..."
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./frontend/node_modules/*" -exec sh -c 'node -e "JSON.parse(require(\"fs\").readFileSync(\"$1\", \"utf8\"))" -- "$1"' _ {} \; || echo "Alguns arquivos JSON podem ter problemas"
        continue-on-error: true
      
      - name: Verificar tamanho de arquivos
        run: |
          echo "📊 Verificando tamanho de arquivos..."
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./frontend/node_modules/*" -exec wc -l {} \; | sort -rn | head -20
      
      - name: Resumo
        run: |
          echo "## 📋 Resumo de Qualidade de Código" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Verificações realizadas:" >> $GITHUB_STEP_SUMMARY
          echo "- Sintaxe JavaScript" >> $GITHUB_STEP_SUMMARY
          echo "- Validação JSON" >> $GITHUB_STEP_SUMMARY
          echo "- Análise de tamanho de arquivos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Para lint completo, considere adicionar ESLint" >> $GITHUB_STEP_SUMMARY

  # Job 2: Análise de segurança (opcional)
  security-scan:
    name: Análise de Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Verificar dependências vulneráveis
        run: |
          echo "🔒 Verificando vulnerabilidades conhecidas..."
          npm audit --audit-level=moderate || echo "Algumas vulnerabilidades podem existir"
        continue-on-error: true
      
      - name: Resumo de segurança
        run: |
          echo "## 🔒 Resumo de Segurança" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Verificação de dependências realizada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Para análise completa, considere:" >> $GITHUB_STEP_SUMMARY
          echo "- Snyk" >> $GITHUB_STEP_SUMMARY
          echo "- Dependabot" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Security Advisories" >> $GITHUB_STEP_SUMMARY

