name: E2E Playwright

# =============================================================================
# Suíte E2E real (frontend-e2e/, Playwright) contra a stack viva:
# PostgreSQL + Redis + API (:3001) + frontend Vite (:5173).
#
# Cobre jornadas operacionais ponta a ponta (login → tenant → páginas → API →
# banco) e o fluxo QA Waves → replay (o cenário executável dispara um RPA com
# Chromium real dentro da API). Antes deste workflow, a suíte só rodava
# localmente e podia apodrecer sem gate.
#
# Browsers: dois builds de Chromium são necessários —
#   - root (playwright 1.57): usado pelo runner RPA da API;
#   - frontend-e2e (@playwright/test 1.54): usado pelas specs.
# O `--with-deps` no root instala as libs de sistema para ambos.
# =============================================================================

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  NODE_VERSION_LTS: '20'

jobs:
  e2e:
    name: "E2E Playwright (stack viva: API + frontend + Postgres + Redis)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_LTS }}
          cache: 'npm'

      - name: Materializar pacotes irmãos @results (fora do checkout)
        run: |
          mkdir -p ../../packages ../packages
          rm -rf ../../packages/auth ../packages/whatsapp-qr-bridge
          cp -r vendor/auth ../../packages/auth
          cp -r vendor/whatsapp-qr-bridge ../packages/whatsapp-qr-bridge
          npm --prefix ../packages/whatsapp-qr-bridge ci --omit=dev --no-audit --no-fund

      - name: Install dependencies (root)
        run: npm ci

      - name: Chromium do runner RPA da API (playwright root) + libs de sistema
        run: npx playwright install --with-deps chromium

      - name: Config mínima de runtime (.env + api/data/config.json)
        run: |
          cp env.example .env
          echo "ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")" >> .env
          cp api/data/config.example.json api/data/config.json
          # Ambiente de QA/E2E: o limite padrão de sessões por agente (3) derruba
          # a sessão do auto-login RPA quando as specs fazem logins sucessivos
          # (Sessão não encontrada → 401 no meio da execução). Em QA o limite
          # precisa acomodar os atores sintéticos; o default de produto (3)
          # permanece inalterado.
          node -e "const fs=require('fs');const p='api/data/config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.auth={...(c.auth||{}),maxSessionsPerAgent:50};fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"

      - name: Run migrations (schema completo no banco efêmero)
        run: npm run db:migrate

      - name: Start API (:3001) e aguardar /health
        run: |
          nohup node api/server.js > /tmp/api-e2e.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3001/health > /dev/null 2>&1; then
              echo "API saudável após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API não respondeu em 90s — últimas linhas do log:"
          tail -100 /tmp/api-e2e.log || true
          exit 1
        env:
          API_PORT: '3001'

      - name: Warmup de auth (elimina cold-start de login no primeiro teste)
        # /health responde antes de o pipeline de auth estar quente; sem este
        # warmup o primeiro login real das specs (fitness) falhava no CI.
        run: |
          for i in $(seq 1 60); do
            TOKEN=$(curl -fsS -X POST "http://localhost:3001/auth/login?tenantId=system" \
              -H 'Content-Type: application/json' \
              -d '{"username":"systemadmin","password":"Admin123!"}' 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);console.log(j.token||j.accessToken||'')}catch{}})")
            if [ -n "$TOKEN" ]; then
              echo "Login funcional após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Login não funcionou em 60s — últimas linhas do log da API:"
          tail -100 /tmp/api-e2e.log || true
          exit 1

      - name: Seed do tenant context (system) — evita 404 tenant_context_not_found
        # Em banco efêmero o contexto do tenant system não existe. O frontend
        # chama GET /tenants/system/context no boot e loga erros de console,
        # o que reprova cenários RPA da wave (critical_console_errors). O PUT
        # cria o contexto na primeira chamada (tenantService.updateTenantContext
        # cria a partir dos dados do tenant quando ausente). Campos validados
        # contra schemas.updateTenantContext (api/utils/inputValidator.js).
        run: |
          TOKEN=$(curl -fsS -X POST "http://localhost:3001/auth/login?tenantId=system" \
            -H 'Content-Type: application/json' \
            -d '{"username":"systemadmin","password":"Admin123!"}' | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).token")
          curl -fsS -X PUT "http://localhost:3001/tenants/system/context" \
            -H "Authorization: Bearer $TOKEN" -H "X-Tenant-Id: system" \
            -H 'Content-Type: application/json' \
            -d '{"ramo_atividade":"Plataforma de operações autônomas (QA E2E)","objetivo":"Validar jornadas ponta a ponta no pipeline de CI"}'
          echo
          curl -fsS "http://localhost:3001/tenants/system/context" \
            -H "Authorization: Bearer $TOKEN" -H "X-Tenant-Id: system" | head -c 200
          echo

      - name: Install dependencies (frontend)
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Start frontend Vite (:5173) e aguardar
        run: |
          nohup npm run start > /tmp/frontend-e2e.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend saudável após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend não respondeu em 90s — últimas linhas do log:"
          tail -100 /tmp/frontend-e2e.log || true
          exit 1
        working-directory: frontend
        env:
          # api/data/config.json (do example) usa api.port=3000; a API do job
          # sobe na 3001 — o proxy do Vite precisa apontar para ela.
          VITE_PROXY_TARGET: http://localhost:3001
          # VITE_API_DEV_PORT deriva de API_PORT (vite.config.mjs define) e
          # alimenta a URL do WebSocket em dev (frontend/src/utils/wsUrl.js).
          # Sem isto o WS aponta para localhost:3000 e cada página loga erros
          # de console (ERR_CONNECTION_REFUSED) — o que reprova o cenário
          # support-inbox-nota-ui da wave (critical_console_errors).
          API_PORT: '3001'

      - name: Install dependencies (frontend-e2e)
        run: npm ci --no-audit --no-fund
        working-directory: frontend-e2e

      - name: Chromium das specs (@playwright/test 1.54)
        run: npx playwright install chromium
        working-directory: frontend-e2e

      - name: Run E2E suite
        run: npx playwright test
        working-directory: frontend-e2e
        env:
          FRONTEND_URL: http://localhost:5173

      - name: Upload Playwright artifacts (falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            frontend-e2e/test-results/
            frontend-e2e/playwright-report/
          retention-days: 7

      - name: Dump API log (falhas)
        if: failure()
        run: tail -200 /tmp/api-e2e.log || true
