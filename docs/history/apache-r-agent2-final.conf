# r-agent2 Configuration (using host localhost ports)
# Apache container can reach other services via host network ports:
# - Frontend: http://127.0.0.1:8086 (host port for r-agent2-frontend-prod)
# - API: http://127.0.0.1:3001 (host port for r-agent2-api-prod)

ProxyPass        "/r-agent2/ws"  "ws://127.0.0.1:3001/api/ws"
ProxyPassReverse "/r-agent2/ws"  "ws://127.0.0.1:3001/api/ws"
ProxyPass        "/r-agent2/api/ws"  "ws://127.0.0.1:3001/api/ws"
ProxyPassReverse "/r-agent2/api/ws"  "ws://127.0.0.1:3001/api/ws"

ProxyPass        "/r-agent2/api/"  "http://127.0.0.1:3001/api/" nocanon
ProxyPassReverse "/r-agent2/api/"  "http://127.0.0.1:3001/api/"

ProxyPass        "/r-agent2/assets"  "http://127.0.0.1:8086/assets" nocanon
ProxyPassReverse "/r-agent2/assets"  "http://127.0.0.1:8086/assets"

ProxyPass        "/r-agent2/images"  "http://127.0.0.1:8086/images" nocanon
ProxyPassReverse "/r-agent2/images"  "http://127.0.0.1:8086/images"

ProxyPass        "/r-agent2"  "http://127.0.0.1:8086" nocanon
ProxyPassReverse "/r-agent2"  "http://127.0.0.1:8086"

<LocationMatch "^/r-agent2/(api/)?ws">
    ProxyPreserveHost On
</LocationMatch>

ProxyPassReverseCookiePath "/" "/r-agent2/"
