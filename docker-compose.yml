version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    image: r-agent2-api:latest
    container_name: chatbot-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Porta interna do container (deve bater com o upstream do nginx do frontend, api:3000)
      API_PORT: ${API_PORT:-3000}
      # DEFAULT_TENANT_ID removido - tenant deve ser fornecido via autenticação
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Políticas de rate limiting (opcional, valores padrão em infra/rate-limit/policies.js)
      RATE_LIMIT_DRY_RUN_POINTS: ${RATE_LIMIT_DRY_RUN_POINTS:-50}
      RATE_LIMIT_DRY_RUN_DURATION: ${RATE_LIMIT_DRY_RUN_DURATION:-60}
      RATE_LIMIT_GENERATION_POINTS: ${RATE_LIMIT_GENERATION_POINTS:-5}
      RATE_LIMIT_GENERATION_DURATION: ${RATE_LIMIT_GENERATION_DURATION:-60}
      RATE_LIMIT_BOOTSTRAP_POINTS: ${RATE_LIMIT_BOOTSTRAP_POINTS:-1}
      RATE_LIMIT_BOOTSTRAP_DURATION: ${RATE_LIMIT_BOOTSTRAP_DURATION:-300}
      RATE_LIMIT_SCRAPING_POINTS: ${RATE_LIMIT_SCRAPING_POINTS:-10}
      RATE_LIMIT_SCRAPING_DURATION: ${RATE_LIMIT_SCRAPING_DURATION:-300}
      RATE_LIMIT_SCRAPING_RPS: ${RATE_LIMIT_SCRAPING_RPS:-3}
      RATE_LIMIT_SCRAPING_PAGES: ${RATE_LIMIT_SCRAPING_PAGES:-20}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag-service:8000}
      RAG_INTERNAL_TOKEN: "${RAG_INTERNAL_TOKEN:?RAG_INTERNAL_TOKEN obrigatória}"
      # PostgreSQL
      DATABASE_URL: ${DATABASE_URL:-postgresql://results_app:StrongPass@postgres:5432/results_saas}
      PGHOST: ${PGHOST:-postgres}
      PGUSER: ${PGUSER:-results_app}
      PGPASSWORD: ${PGPASSWORD:-StrongPass}
      PGDATABASE: ${PGDATABASE:-results_saas}
      PGPORT: ${PGPORT:-5432}
      # Criptografia de segredos
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY obrigatória}
      # OpenAI API Key (server default, opcional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WWEBJS_AUTH_PATH: ${WWEBJS_AUTH_PATH:-/var/lib/ragent2/whatsapp/auth}
      QA_MESH_HISTORY_DIR: ${QA_MESH_HISTORY_DIR:-/var/lib/ragent2/qa-mesh/history}
      QA_MESH_EVIDENCE_DIR: ${QA_MESH_EVIDENCE_DIR:-/var/lib/ragent2/qa-mesh/evidence}
      QA_MESH_SYSTEM_VALIDATE_DIR: ${QA_MESH_SYSTEM_VALIDATE_DIR:-/var/lib/ragent2/qa-mesh/system-validate}
      RELEASE_EVIDENCE_BASE_DIR: ${RELEASE_EVIDENCE_BASE_DIR:-/var/lib/ragent2/release-evidence}
      # -------------------------------------------------------------------
      # PBX v1 (Asterisk Realtime/ODBC + AMI)
      # -------------------------------------------------------------------
      AMI_HOST: ${AMI_HOST:-asterisk}
      AMI_PORT: ${AMI_PORT:-5038}
      AMI_USERNAME: ${AMI_USERNAME:-ragent2}
      AMI_SECRET: "${AMI_SECRET:?Erro: AMI_SECRET não definida}"
      AMI_ORIGINATE_ENABLED: ${AMI_ORIGINATE_ENABLED:-false}
      PBX_MEDIA_DIR: ${PBX_MEDIA_DIR:-/app/api/data/pbx-media}
      PBX_RECORDINGS_DIR: ${PBX_RECORDINGS_DIR:-/app/api/data/pbx-recordings}
      PBX_RECORDING_ENABLED: ${PBX_RECORDING_ENABLED:-false}
      PBX_MIXMONITOR_DIR: ${PBX_MIXMONITOR_DIR:-/var/spool/asterisk/monitor/pbx}
      # Include de contextos realtime por tenant, gerado por api/services/pbx/pbxDialplanService.js.
      # Vazio por padrão: a geração é opt-in e nada muda sem que um deployment a defina.
      PBX_ASTERISK_TENANTS_CONF: ${PBX_ASTERISK_TENANTS_CONF:-}
    ports:
      # Porta exposta no host (externa) -> porta interna do container (3000)
      - "${API_HOST_PORT:-3001}:${API_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-service:
        condition: service_started
      asterisk:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - r-agent2-runtime:/var/lib/ragent2
      - pbx-media:/app/api/data/pbx-media
      - pbx-recordings:/app/api/data/pbx-recordings
      # Token RPA canônico do workspace (excluído da imagem via .dockerignore):
      # montado em runtime para que /auth/rpa/login funcione no stack local.
      - ./core/rpa/config/rpa-token.json:/app/core/rpa/config/rpa-token.json:ro

  asterisk:
    build:
      context: ./pbx/asterisk
      dockerfile: ./Dockerfile
    image: r-agent2-asterisk:latest
    container_name: chatbot-asterisk
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Mesma origem da API: o segredo do AMI vem do .env e é renderizado no
      # manager.conf em runtime (template -> tmpfs), nunca versionado.
      AMI_SECRET: "${AMI_SECRET:?Erro: AMI_SECRET não definida}"
      # DSN ODBC dirigido por ambiente (opt-in). Sem estes valores o container usa o
      # /etc/odbc.ini montado do repositório, exatamente como antes — prod e test não mudam.
      # Quando definidos, o DSN é renderizado do template e as credenciais deixam de ser
      # fixas no repositório (ver pbx/asterisk/etc/odbc.ini.template e res_odbc.conf).
      PBX_ODBC_HOST: ${PBX_ODBC_HOST:-}
      PBX_ODBC_PORT: ${PBX_ODBC_PORT:-}
      PBX_ODBC_DB: ${PBX_ODBC_DB:-}
      PBX_ODBC_USER: ${PBX_ODBC_USER:-}
      PBX_ODBC_PASSWORD: ${PBX_ODBC_PASSWORD:-}
    volumes:
      - ./pbx/asterisk/etc/asterisk:/etc/asterisk-static:ro
      - ./pbx/asterisk/etc/odbc.ini:/etc/odbc.ini:ro
      - ./pbx/asterisk/etc/odbc.ini.template:/etc/asterisk-odbc.template:ro
      - ./pbx/asterisk/etc/odbcinst.ini:/etc/odbcinst.ini:ro
      - pbx-media:/var/lib/asterisk/sounds/pbx
      - pbx-recordings:/var/spool/asterisk/monitor/pbx
      # /etc/asterisk gravável só na memória do container: o start renderiza o
      # manager.conf do template (segredo + ACL no mesmo bloco) antes de subir.
      # mode 1777 é obrigatório: o processo roda como usuário asterisk.
      - type: tmpfs
        target: /etc/asterisk
        tmpfs:
          mode: 0o1777
    command: ["sh", "/usr/local/bin/asterisk-start"]
    ports:
      # AMI fail-closed em loopback por padrão (mesmo padrão do prod): publicar
      # em 0.0.0.0 expõe o controle do PBX a TODO container do host via gateway
      # docker0 — foi o caminho medido do leak 172.17.0.1:5038 a partir do
      # container de pesquisa (AI_MEMORY/security-finding-pbx-ami-exposure.md).
      - "${AMI_PUBLIC_BIND:-127.0.0.1}:${AMI_PUBLIC_PORT:-5038}:5038"
      - "${SIP_UDP_PORT:-5060}:5060/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/r-agent2/}
    image: r-agent2-frontend:latest
    container_name: chatbot-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # VITE_API_BASE_URL vazio para usar URLs relativas (proxy nginx)
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  rag-service:
    build:
      context: ./rag-service
      dockerfile: ./Dockerfile
    image: r-agent2-rag-service:latest
    container_name: chatbot-rag-service
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      RAG_ENVIRONMENT: production
      RAG_INTERNAL_TOKEN: "${RAG_INTERNAL_TOKEN:?RAG_INTERNAL_TOKEN obrigatória}"
      DEBUG: ${RAG_DEBUG:-false}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      CHUNK_STRATEGY: ${RAG_CHUNK_STRATEGY:-sentence}
      VECTOR_STORE_TYPE: ${RAG_VECTOR_STORE_TYPE:-postgres}
      RAG_DATA_ROOT: ${RAG_DATA_ROOT:-/var/lib/ragent2/rag}
      VECTOR_STORE_PATH: ${VECTOR_STORE_PATH:-/var/lib/ragent2/rag/vector_store}
      ADAPTIVE_LEARNING_DATA_PATH: ${ADAPTIVE_LEARNING_DATA_PATH:-/var/lib/ragent2/rag/adaptive_learning}
      LLM_PROVIDER: ${RAG_LLM_PROVIDER:-openai}
      LLM_MODEL: ${RAG_LLM_MODEL:-gpt-3.5-turbo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Usa o mesmo Postgres da API (fonte única)
      DATABASE_URL: ${DATABASE_URL:-postgresql://results_app:StrongPass@postgres:5432/results_saas}
    expose:
      - "8000"
    # Publicação localhost-only na porta canônica de dev (8001): probes de
    # governança no host (rag-domain-segregation-report) e dev local alcançam
    # o serviço; a API continua usando a rede interna (rag-service:8000).
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - r-agent2-rag-data:/var/lib/ragent2/rag
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot-postgres
    environment:
      POSTGRES_USER: ${PGUSER:-results_app}
      POSTGRES_PASSWORD: ${PGPASSWORD:-StrongPass}
      POSTGRES_DB: ${PGDATABASE:-results_saas}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-r_agent2}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    build:
      context: ./redis
      dockerfile: ./Dockerfile
    image: r-agent2-redis:latest
    container_name: chatbot-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  r-agent2-runtime:
  r-agent2-rag-data:
  redis-data:
  postgres-data:
  pbx-media:
  pbx-recordings:
