[general]
enabled = yes
webenabled = no
port = 5038
; bindaddr = 0.0.0.0 é ACEITÁVEL aqui porque o Asterisk roda em container e este
; 0.0.0.0 é o da netns do container — o que controla a exposição é a PUBLICAÇÃO
; no compose, não este valor. NÃO "corrija" isto para um IP do host: dentro do
; container esse IP não existe e o AMI para de subir.
;
; CADEIA DE EXPOSIÇÃO MEDIDA (2026-09-19) — não reintroduza:
;   1. docker-compose publicava AMI em 0.0.0.0 do HOST
;      -> o container de pesquisa do MCP alcançava 172.17.0.1:5038 pelo docker0;
;   2. ACL abaixo era `deny 0.0.0.0/0` seguido de `permit 0.0.0.0/0` (o permit
;      vence) -> qualquer origem passava;
;   3. segredo do usuário `ragent2` é valor fixo versionado.
;   RESULTADO PROVADO: de dentro do container de pesquisa,
;     "Response: Success / Message: Authentication accepted / Privilege: system,all"
;   Ou seja: o container que baixa conteúdo ARBITRÁRIO da internet obtinha
;   CONTROLE TOTAL do PBX (originar chamadas, ler CDR, recarregar).
;
; Correção 1 aplicada: publicação amarrada a 127.0.0.1 por padrão
; (AMI_PUBLIC_BIND no docker-compose.prod.yml, fail-closed).
; Correções 2 e 3 PENDENTES de decisão coordenada (ACL por origem + segredo
; forte fora do versionamento): mudar o segredo sozinho quebra a integração da
; API, e a ACL precisa do endereço do container da API.
bindaddr = 0.0.0.0

; Usuário AMI usado pelo r-agent2 para originate/reload.
;
; SEGREDO LITERAL — PENDÊNCIA ABERTA, com as tentativas REFUTADAS por medição:
;   - `${ENV(AMI_SECRET)}` aqui: a seção INTEIRA é descartada e o AMI deixa de
;     existir ("There is no manager called ragent2").
;   - `#include conf/manager-ami.conf` com o segredo lá: o include CARREGA o
;     usuário e o segredo, mas o `#include` REINICIA a seção e a ACL é perdida
;     (`manager show user ragent2` -> `ACL: no`), mesmo com deny/permit no
;     arquivo principal. Com `permit` apontando para um endereço impossível,
;     TODAS as origens continuaram recebendo resposta: a ACL ficava INERTE.
;   NÃO usar nenhum dos dois. Tirar o segredo do repositório exige gerar o
;   manager.conf COMPLETO (segredo + ACL no MESMO bloco) num diretório gravável
;   e apontar o Asterisk para ele — mecanismo ainda não implementado nem provado.
;
; ACL POR ORIGEM — literal porque NÃO é segredo, e é a defesa que impede o
; container de pesquisa (ou qualquer outro do host) de autenticar no AMI.
; Ordem: a PRIMEIRA correspondência decide (medido 2026-09-19 por origem, com
; contra-prova de senha errada), por isso o `deny` final é o
; que fecha.
;   - 127.0.0.1: API rodando no host (dev);
;   - 172.30.0.0/16: rede da plataforma (RAP_PLATFORM_SUBNET no compose).
; NÃO voltar a `permit = 0.0.0.0/0.0.0.0`: era isso que deixava o gateway
; docker0 autenticar com privilégio system,all.
[ragent2]
secret = ragent2
read = all
write = all
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 172.30.0.0/16
