# WORKFLOW AUXILIAR: Seed manual da plataforma via RPA — disparado manualmente.
name: Seed Plataforma via RPA [AUXILIAR]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para executar seed'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - test
  schedule:
    # Executa diariamente às 2h da manhã
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths:
      - 'tests/rpa/recordings/**'
      - 'tests/rpa/seedPlatformRPA.js'

jobs:
  seed-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Instalar Playwright
        run: npx playwright install chromium --with-deps
      
      - name: Iniciar servidor (se necessário)
        run: |
          npm run start:api &
          sleep 10
        continue-on-error: true
      
      - name: Executar Seed via RPA
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL || 'http://localhost:3000' }}
          TEST_FRONTEND_URL: ${{ secrets.TEST_FRONTEND_URL || 'http://localhost:5173' }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL || 'admin@example.com' }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: |
          node tests/rpa/seedPlatformRPA.js
        continue-on-error: false
      
      - name: Upload relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-seed-reports
          path: tests/rpa/reports/*.json
          retention-days: 30
      
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-seed-screenshots
          path: tests/rpa/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Upload replays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-seed-replays
          path: tests/rpa/replay/*.json
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Resumo da execução
        if: always()
        run: |
          echo "## 🌱 Resumo do Seed RPA" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ambiente:** ${{ inputs.environment || 'development' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Artifacts gerados:" >> $GITHUB_STEP_SUMMARY
          echo "- Relatórios JSON" >> $GITHUB_STEP_SUMMARY
          echo "- Screenshots (se houver erros)" >> $GITHUB_STEP_SUMMARY
          echo "- Replays da execução" >> $GITHUB_STEP_SUMMARY

