name: Pipeline Completo CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Fase 1: Validação e Testes
  validation:
    name: Validação e Testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Testes Unitários
        run: npm run test:unit
      
      - name: Validação Estrutural
        run: npm run test:flow
      
      - name: Seed de Dados
        run: npm run seed:test
      
      - name: Gate de Dados
        run: npm run test:data
      
      - name: Testes de Scripts
        run: npm run test:scripts
        continue-on-error: true

  # Fase 2: Testes RPA
  rpa-tests:
    name: Testes RPA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validation]
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Instalar Playwright
        run: npx playwright install chromium --with-deps
      
      - name: Executar testes RPA em modo CI
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL || 'http://localhost:3000' }}
          TEST_FRONTEND_URL: ${{ secrets.TEST_FRONTEND_URL || 'http://localhost:5173' }}
        run: |
          node tests/rpa/cli.js ci example-login || echo "Seed example-login não disponível ou falhou"
        continue-on-error: true
      
      - name: Upload artifacts RPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-artifacts
          path: |
            tests/rpa/replay/*.json
            tests/rpa/reports/*.json
          retention-days: 7
          if-no-files-found: ignore

  # Fase 3: Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validation]
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
        continue-on-error: true
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1
          if-no-files-found: ignore

  # Fase 4: Resumo Final
  summary:
    name: Resumo do Pipeline
    runs-on: ubuntu-latest
    needs: [validation, rpa-tests, build]
    if: always()
    
    steps:
      - name: Resumo completo
        run: |
          echo "## 🎯 Resumo do Pipeline CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fases Executadas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Fase | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validação e Testes | ${{ needs.validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Testes RPA | ${{ needs.rpa-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.validation.result }}" != "success" ]; then
            echo "❌ **Pipeline falhou na fase de validação**" >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ "${{ needs.build.result }}" != "success" ]; then
            echo "⚠️ **Pipeline completou, mas build falhou**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Pipeline executado com sucesso**" >> $GITHUB_STEP_SUMMARY
          fi

