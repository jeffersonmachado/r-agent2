name: Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # Job 1: Validação antes do deploy
  pre-deploy:
    name: Validação Pré-Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/r_agent2

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r_agent2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d r_agent2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Alinhado com package.json engines: ">=20.19.0 || >=22.12.0"
          node-version: '20.19.0'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Iniciar Frontend (Vite) e executar validação oficial
        run: |
          cleanup() {
            kill "${VITE_PID:-}" 2>/dev/null || true
          }
          trap cleanup EXIT
          cd frontend
          npm ci
          npm run start -- --host 0.0.0.0 --port 5173 --strictPort &
          VITE_PID=$!
          cd ..
          node -e "const http=require('http'); const url='http://127.0.0.1:5173'; let tries=60; (function ping(){ http.get(url,res=>{process.exit(0)}).on('error',()=>{ if(--tries<=0) process.exit(1); setTimeout(ping,1000); });})();"
          npm run system:validate
      
      - name: Verificar build
        run: |
          cd frontend
          npm ci
          npm run build

  # Job 2: Build Docker
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [pre-deploy]
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub (se configurado)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
      
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api/Dockerfile
          push: false
          tags: chatbot-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: chatbot-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build RAG Service image
        uses: docker/build-push-action@v5
        with:
          context: ./rag-service
          file: ./rag-service/Dockerfile
          push: false
          tags: chatbot-rag:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Deploy (placeholder - configurar conforme ambiente)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [pre-deploy, build-docker]
    if: github.event_name != 'pull_request'
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Deploy placeholder
        run: |
          echo "🚀 Deploy para ambiente: ${{ inputs.environment || 'staging' }}"
          echo ""
          echo "📋 Próximos passos:"
          echo "1. Configurar secrets de deploy"
          echo "2. Configurar servidor de destino"
          echo "3. Implementar script de deploy"
          echo ""
          echo "💡 Exemplos de deploy:"
          echo "- SSH deploy"
          echo "- Kubernetes"
          echo "- Cloud provider (AWS, GCP, Azure)"
          echo "- Docker Compose"
      
      - name: Notificação de deploy
        if: always()
        run: |
          echo "## 🚀 Deploy Concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ambiente:** ${{ inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
