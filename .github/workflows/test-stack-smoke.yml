# WORKFLOW AUXILIAR: Smoke rapido da stack — subconjunto do stack-test oficial.
name: Test Stack Smoke [AUXILIAR]

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'docker-compose.test.yml'
      - 'package.json'
      - 'tests/rpa/**'
      - 'scripts/test-stack-*.sh'
      - 'api/**'
      - 'engine/**'
      - 'frontend/**'
      - 'infra/**'
      - 'rag-service/**'
      - '.github/workflows/test-stack-smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docker-compose.test.yml'
      - 'package.json'
      - 'tests/rpa/**'
      - 'scripts/test-stack-*.sh'
      - 'api/**'
      - 'engine/**'
      - 'frontend/**'
      - 'infra/**'
      - 'rag-service/**'
      - '.github/workflows/test-stack-smoke.yml'

jobs:
  stack-smoke:
    name: Stack Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Record stack smoke start
        run: echo "STACK_SMOKE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run full test stack workflow
        id: stack_full
        env:
          STACK_KEEP_UP: '1'
        run: npm run test:stack:full

      - name: Run screen catalog RPA on test stack
        id: rpa_screens
        env:
          TEST_FRONTEND_URL: http://localhost:15173
          TEST_API_URL: http://localhost:13001
          TEST_BASE_URL: http://localhost:13001
          TEST_TENANT_ID: system
          TEST_USERNAME: admin
          TEST_USER_PASSWORD: admin123
          TEST_ADMIN_USERNAME: admin
          TEST_ADMIN_PASSWORD: admin123
          RPA_IGNORE_API_CONSOLE_ERRORS: 'true'
        run: npm run test:rpa:screens

      - name: Capture docker compose diagnostics
        if: always()
        run: |
          docker compose -f docker-compose.test.yml ps > /tmp/test-stack-ps.txt || true
          docker compose -f docker-compose.test.yml logs --no-color > /tmp/test-stack.log || true

      - name: Upload stack smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stack-smoke
          path: |
            /tmp/test-stack-ps.txt
            /tmp/test-stack.log
            tests/rpa/reports/**/*.json
            tests/rpa/reports/**/*.md
            tests/rpa/screenshots/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v || true

      - name: Summarize stack smoke
        if: always()
        run: |
          END_TS="$(date +%s)"
          DURATION="unknown"
          if [ -n "${STACK_SMOKE_STARTED_AT:-}" ]; then
            DURATION="$((END_TS - STACK_SMOKE_STARTED_AT))s"
          fi

          echo "## Test Stack Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: ${{ steps.stack_full.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Screen Catalog RPA: ${{ steps.rpa_screens.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duration: ${DURATION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Command: npm run test:stack:full" >> "$GITHUB_STEP_SUMMARY"
          echo "- Extra command: npm run test:rpa:screens" >> "$GITHUB_STEP_SUMMARY"
          echo "- Non-blocking workflow: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Diagnostics artifact: test-stack-smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cleanup: docker compose down -v" >> "$GITHUB_STEP_SUMMARY"

          if [ -f /tmp/test-stack-ps.txt ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### docker compose ps" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/test-stack-ps.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
