# WORKFLOW AUXILIAR: Pipeline integrado CI/CD (build + deploy) — ativado em push a main.
# Para gate de CI, o pipeline oficial e o stack-test ja cobrem.
name: Pipeline Completo CI/CD [AUXILIAR]

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Fase 1: Validação e Testes
  validation:
    name: Validação e Testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/r_agent2

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r_agent2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d r_agent2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Alinhado com package.json engines: ">=20.19.0 || >=22.12.0"
          node-version: '20.19.0'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Executar migrations do banco
        run: npm run db:migrate

      - name: Iniciar Frontend (Vite) e executar validação oficial
        run: |
          cleanup() {
            kill "${VITE_PID:-}" 2>/dev/null || true
          }
          trap cleanup EXIT
          cd frontend
          npm ci
          npm run start -- --host 0.0.0.0 --port 5173 --strictPort &
          VITE_PID=$!
          cd ..
          node -e "const http=require('http'); const url='http://127.0.0.1:5173'; let tries=60; (function ping(){ http.get(url,res=>{process.exit(0)}).on('error',()=>{ if(--tries<=0) process.exit(1); setTimeout(ping,1000); });})();"
          npm run system:validate

      - name: Smoke scheduling support API (não bloqueante)
        continue-on-error: true
        env:
          API_BASE_URL: http://127.0.0.1:3001
          TEST_TENANT_ID: tenant-demo
          SMOKE_SKIP_IF_API_UNREACHABLE: 'true'
        run: npm run test:scheduling-support:smoke

      - name: Upload artifact do smoke scheduling support
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduling-support-smoke
          path: /tmp/scheduling_support_smoke_report.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Resumo do smoke scheduling support
        if: always()
        run: |
          echo "## Scheduling Support Smoke" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/scheduling_support_smoke_report.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/scheduling_support_smoke_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Report not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts RPA (relatórios)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-reports
          path: tests/rpa/reports/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload RPA replay/screenshot (se houver)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-artifacts
          path: |
            tests/rpa/replay/*.json
            tests/rpa/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

  # Fase 3: Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validation]
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1
          if-no-files-found: ignore

  # Fase 4: Resumo Final
  summary:
    name: Resumo do Pipeline
    runs-on: ubuntu-latest
    needs: [validation, build]
    if: always()
    
    steps:
      - name: Resumo completo
        run: |
          echo "## 🎯 Resumo do Pipeline CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fases Executadas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Fase | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validação e Testes | ${{ needs.validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.validation.result }}" != "success" ]; then
            echo "❌ **Pipeline falhou na fase de validação**" >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ "${{ needs.build.result }}" != "success" ]; then
            echo "⚠️ **Pipeline completou, mas build falhou**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Pipeline executado com sucesso**" >> $GITHUB_STEP_SUMMARY
          fi
