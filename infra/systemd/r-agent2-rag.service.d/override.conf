# Override do unit r-agent2-rag.service
#
# Problema: o unit base (/etc/systemd/system/r-agent2-rag.service) binda a
# porta 8000, que no modelo oficial de produção pertence ao container Docker
# do rag-service (docker-compose.prod.yml publica "8000"). Resultado: o unit
# morre em loop com Errno 98 (address already in use).
#
# No modelo host (dev/stack local), a API espera o RAG em :8001
# (default de rag.serviceUrl em api/services/rag/ragRuntime.js).
#
# Este drop-in alinha o unit ao modelo host: porta 8001.
# ExecStart precisa ser limpo antes de redefinir (semântica do systemd).

[Service]
ExecStart=
ExecStart=/opt/results/ria/r-agent2/rag-service/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8001 --env-file .env
