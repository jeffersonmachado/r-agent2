name: Release Gate [OFICIAL]

on:
  push:
    branches: [ main ]
    tags:
      - v*
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/r_agent2
      RUNTIME_ROOT: /tmp/ragent2-runtime-release

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r_agent2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d r_agent2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm run frontend:install

      - name: Install Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: System release
        run: npm run system:release

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts
          path: |
            dist/*.zip
            dist/*.manifest.json
            qa/release-gate-report.json
            qa/go-no-go-report.json
            qa/runtime-governance-report.json
            qa/release-manifest.json
            qa/release-summary.md
          retention-days: 14
          if-no-files-found: ignore
