# Configuração Apache para r-agent2 (Apache em container)
# Adicionar estas linhas no VirtualHost :443 do Apache container
# Upstreams Docker (mesma rede):
# - Frontend: r-agent2-frontend-prod:80
# - API: r-agent2-api-prod:3000

# WebSocket do r-agent2 (tempo real)
# IMPORTANTE: Esta configuração deve vir ANTES do ProxyPass geral /r-agent2/
# para que o Apache faça o upgrade correto do WebSocket
# O frontend conecta em /r-agent2/ws ou /r-agent2/api/ws, ambos devem funcionar
ProxyPass        "/r-agent2/ws"  "ws://r-agent2-api-prod:3000/api/ws"
ProxyPassReverse "/r-agent2/ws"  "ws://r-agent2-api-prod:3000/api/ws"
ProxyPass        "/r-agent2/api/ws"  "ws://r-agent2-api-prod:3000/api/ws"
ProxyPassReverse "/r-agent2/api/ws"  "ws://r-agent2-api-prod:3000/api/ws"

# API HTTP do r-agent2 (evita depender de reproxy interno do frontend)
# IMPORTANTE: Remove /api/ do caminho para matchear rotas do backend (/tenants, /auth, /super-admin, etc)
ProxyPass        "/r-agent2/api/"  "http://r-agent2-api-prod:3000/" nocanon
ProxyPassReverse "/r-agent2/api/"  "http://r-agent2-api-prod:3000/"

# Assets do r-agent2 (arquivos JS, CSS, etc.)
# IMPORTANTE: Apenas assets do r-agent2, não global /assets/
ProxyPass        "/r-agent2/assets"  "http://r-agent2-frontend-prod:80/assets" nocanon
ProxyPassReverse "/r-agent2/assets"  "http://r-agent2-frontend-prod:80/assets"

# Imagens do r-agent2
# IMPORTANTE: Apenas imagens do r-agent2, não global /images/
ProxyPass        "/r-agent2/images"  "http://r-agent2-frontend-prod:80/images" nocanon
ProxyPassReverse "/r-agent2/images"  "http://r-agent2-frontend-prod:80/images"

# Rota principal para r-agent2 (frontend SPA)
# IMPORTANTE: Esta deve ser a ÚLTIMA configuração (catch-all)
ProxyPass        "/r-agent2"  "http://r-agent2-frontend-prod:80" nocanon
ProxyPassReverse "/r-agent2"  "http://r-agent2-frontend-prod:80"

# Headers necessários para WebSocket (upgrade HTTP -> WebSocket)
<LocationMatch "^/r-agent2/(api/)?ws">
    ProxyPassReverse "ws://r-agent2-api-prod:3000/api/ws"
    ProxyPreserveHost On
    ProxyPassReverse "ws://r-agent2-api-prod:3000/api/ws"
</LocationMatch>

# Garante que os cookies e headers sejam preservados
# IMPORTANTE: Isso ajusta o caminho dos cookies para funcionar corretamente com o prefixo /r-agent2/
ProxyPassReverseCookiePath "/" "/r-agent2/"

# NOTA: As linhas ProxyPassReverse para /login, /dashboard, /support foram removidas porque:
# - O frontend é uma SPA React que usa redirecionamentos JavaScript (navigate('/login'))
# - Não há redirecionamentos HTTP do servidor (301/302) para essas rotas
# - O script JavaScript injetado no nginx já corrige os redirecionamentos via pushState
# - Se no futuro houver redirecionamentos HTTP, adicione ProxyPassReverse conforme necessário

