name: Deploy [OFICIAL]

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Run ID do workflow Release Gate que publicou o artefato aprovado
        required: true
      execute_deploy:
        description: Executar deploy real (1) ou dry-run (0)
        required: true
        default: '0'

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact aprovado
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: release-gate.yml
          run_id: ${{ github.event.inputs.release_run_id }}
          name: release-gate-artifacts
          path: .
          if_no_artifact_found: fail

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy oficial
        env:
          SYSTEM_DEPLOY_EXECUTE: ${{ github.event.inputs.execute_deploy || '0' }}
        run: npm run system:deploy
