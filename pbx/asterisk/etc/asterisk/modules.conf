[modules]
autoload=yes
noload => chan_sip.so

; Silence optional modules that are not used by this stack and tend to log
; "declined to load" during startup in this container image.
noload => app_agent_pool.so
noload => res_parking.so
noload => cdr_csv.so
noload => cdr_odbc.so
noload => cdr_pgsql.so
noload => cdr_manager.so
noload => cdr_sqlite3_custom.so
noload => cel_pgsql.so
noload => cel_manager.so
noload => cel_sqlite3_custom.so
noload => app_alarmreceiver.so
noload => chan_unistim.so
noload => pbx_ael.so
noload => pbx_dundi.so
noload => app_amd.so
noload => app_followme.so
noload => chan_oss.so
noload => res_prometheus.so
noload => func_odbc.so

; Optional modules that frequently emit noise/errors in minimal container setups.
noload => res_config_pgsql.so
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_stun_monitor.so
noload => chan_console.so
noload => chan_iax2.so
noload => chan_skinny.so
noload => chan_alsa.so
noload => res_hep.so
noload => res_hep_rtcp.so
noload => res_hep_pjsip.so
noload => res_ari.so
noload => res_ari_applications.so
