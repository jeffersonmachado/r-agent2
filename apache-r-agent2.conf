# Configuração Apache para r-agent2 (Apache em container)
# Adicionar estas linhas no VirtualHost :443 do Apache container
# Upstreams Docker (mesma rede):
# - Frontend: r-agent2-frontend-prod:80
# - API: r-agent2-api-prod:3000

# WebSocket do r-agent2 (tempo real)
# IMPORTANTE: Esta configuração deve vir ANTES do ProxyPass geral /r-agent2/
# para que o Apache faça o upgrade correto do WebSocket
# O frontend conecta em /r-agent2/ws ou /r-agent2/api/ws, ambos devem funcionar
ProxyPass        "/r-agent2/ws"  "ws://r-agent2-api-prod:3000/api/ws"
ProxyPassReverse "/r-agent2/ws"  "ws://r-agent2-api-prod:3000/api/ws"
ProxyPass        "/r-agent2/api/ws"  "ws://r-agent2-api-prod:3000/api/ws"
ProxyPassReverse "/r-agent2/api/ws"  "ws://r-agent2-api-prod:3000/api/ws"

# API HTTP do r-agent2 (evita depender de reproxy interno do frontend)
# IMPORTANTE: Remove /api/ do caminho para matchear rotas do backend (/tenants, /auth, /super-admin, etc)
#
# EXCEÇÕES (2026-08-28): famílias de rotas que existem APENAS com o prefixo /api
# no backend (ex.: /api/access-control/decisions/resolve, /api/fitness/...).
# Estas regras preservam o /api e devem vir ANTES do ProxyPass geral abaixo,
# pois o Apache aplica a primeira regra que casa. Mantidas em sincronia com a
# lista de exceções do frontend/nginx.conf (location ~ ^/api/(...)).
ProxyPass        "/r-agent2/api/access-control/"  "http://r-agent2-api-prod:3000/api/access-control/" nocanon
ProxyPassReverse "/r-agent2/api/access-control/"  "http://r-agent2-api-prod:3000/api/access-control/"
ProxyPass        "/r-agent2/api/fitness/"  "http://r-agent2-api-prod:3000/api/fitness/" nocanon
ProxyPassReverse "/r-agent2/api/fitness/"  "http://r-agent2-api-prod:3000/api/fitness/"
ProxyPass        "/r-agent2/api/beauty/"  "http://r-agent2-api-prod:3000/api/beauty/" nocanon
ProxyPassReverse "/r-agent2/api/beauty/"  "http://r-agent2-api-prod:3000/api/beauty/"
ProxyPass        "/r-agent2/api/pbx/"  "http://r-agent2-api-prod:3000/api/pbx/" nocanon
ProxyPassReverse "/r-agent2/api/pbx/"  "http://r-agent2-api-prod:3000/api/pbx/"
ProxyPass        "/r-agent2/api/pbx-legacy/"  "http://r-agent2-api-prod:3000/api/pbx-legacy/" nocanon
ProxyPassReverse "/r-agent2/api/pbx-legacy/"  "http://r-agent2-api-prod:3000/api/pbx-legacy/"
ProxyPass        "/r-agent2/api/cc/"  "http://r-agent2-api-prod:3000/api/cc/" nocanon
ProxyPassReverse "/r-agent2/api/cc/"  "http://r-agent2-api-prod:3000/api/cc/"
ProxyPass        "/r-agent2/api/marketing/"  "http://r-agent2-api-prod:3000/api/marketing/" nocanon
ProxyPassReverse "/r-agent2/api/marketing/"  "http://r-agent2-api-prod:3000/api/marketing/"
ProxyPass        "/r-agent2/api/crm/"  "http://r-agent2-api-prod:3000/api/crm/" nocanon
ProxyPassReverse "/r-agent2/api/crm/"  "http://r-agent2-api-prod:3000/api/crm/"
ProxyPass        "/r-agent2/api/ops/"  "http://r-agent2-api-prod:3000/api/ops/" nocanon
ProxyPassReverse "/r-agent2/api/ops/"  "http://r-agent2-api-prod:3000/api/ops/"
ProxyPass        "/r-agent2/api/executions/"  "http://r-agent2-api-prod:3000/api/executions/" nocanon
ProxyPassReverse "/r-agent2/api/executions/"  "http://r-agent2-api-prod:3000/api/executions/"
ProxyPass        "/r-agent2/api/voice/"  "http://r-agent2-api-prod:3000/api/voice/" nocanon
ProxyPassReverse "/r-agent2/api/voice/"  "http://r-agent2-api-prod:3000/api/voice/"
ProxyPass        "/r-agent2/api/event-ledger/"  "http://r-agent2-api-prod:3000/api/event-ledger/" nocanon
ProxyPassReverse "/r-agent2/api/event-ledger/"  "http://r-agent2-api-prod:3000/api/event-ledger/"
ProxyPass        "/r-agent2/api/tenant-settings/"  "http://r-agent2-api-prod:3000/api/tenant-settings/" nocanon
ProxyPassReverse "/r-agent2/api/tenant-settings/"  "http://r-agent2-api-prod:3000/api/tenant-settings/"
ProxyPass        "/r-agent2/api/support/"  "http://r-agent2-api-prod:3000/api/support/" nocanon
ProxyPassReverse "/r-agent2/api/support/"  "http://r-agent2-api-prod:3000/api/support/"
ProxyPass        "/r-agent2/api/backup/"  "http://r-agent2-api-prod:3000/api/backup/" nocanon
ProxyPassReverse "/r-agent2/api/backup/"  "http://r-agent2-api-prod:3000/api/backup/"
ProxyPass        "/r-agent2/api/node-marketplace/"  "http://r-agent2-api-prod:3000/api/node-marketplace/" nocanon
ProxyPassReverse "/r-agent2/api/node-marketplace/"  "http://r-agent2-api-prod:3000/api/node-marketplace/"
ProxyPass        "/r-agent2/api/solutions/"  "http://r-agent2-api-prod:3000/api/solutions/" nocanon
ProxyPassReverse "/r-agent2/api/solutions/"  "http://r-agent2-api-prod:3000/api/solutions/"
ProxyPass        "/r-agent2/api/physical/"  "http://r-agent2-api-prod:3000/api/physical/" nocanon
ProxyPassReverse "/r-agent2/api/physical/"  "http://r-agent2-api-prod:3000/api/physical/"
ProxyPass        "/r-agent2/api/orders/"  "http://r-agent2-api-prod:3000/api/orders/" nocanon
ProxyPassReverse "/r-agent2/api/orders/"  "http://r-agent2-api-prod:3000/api/orders/"

ProxyPass        "/r-agent2/api/"  "http://r-agent2-api-prod:3000/" nocanon
ProxyPassReverse "/r-agent2/api/"  "http://r-agent2-api-prod:3000/"

# Assets do r-agent2 (arquivos JS, CSS, etc.)
# IMPORTANTE: Apenas assets do r-agent2, não global /assets/
ProxyPass        "/r-agent2/assets"  "http://r-agent2-frontend-prod:80/assets" nocanon
ProxyPassReverse "/r-agent2/assets"  "http://r-agent2-frontend-prod:80/assets"

# Imagens do r-agent2
# IMPORTANTE: Apenas imagens do r-agent2, não global /images/
ProxyPass        "/r-agent2/images"  "http://r-agent2-frontend-prod:80/images" nocanon
ProxyPassReverse "/r-agent2/images"  "http://r-agent2-frontend-prod:80/images"

# Rota principal para r-agent2 (frontend SPA)
# IMPORTANTE: Esta deve ser a ÚLTIMA configuração (catch-all)
ProxyPass        "/r-agent2"  "http://r-agent2-frontend-prod:80" nocanon
ProxyPassReverse "/r-agent2"  "http://r-agent2-frontend-prod:80"

# Headers necessários para WebSocket (upgrade HTTP -> WebSocket)
<LocationMatch "^/r-agent2/(api/)?ws">
    ProxyPassReverse "ws://r-agent2-api-prod:3000/api/ws"
    ProxyPreserveHost On
    ProxyPassReverse "ws://r-agent2-api-prod:3000/api/ws"
</LocationMatch>

# Garante que os cookies e headers sejam preservados
# IMPORTANTE: Isso ajusta o caminho dos cookies para funcionar corretamente com o prefixo /r-agent2/
ProxyPassReverseCookiePath "/" "/r-agent2/"

# NOTA: As linhas ProxyPassReverse para /login, /dashboard, /support foram removidas porque:
# - O frontend é uma SPA React que usa redirecionamentos JavaScript (navigate('/login'))
# - Não há redirecionamentos HTTP do servidor (301/302) para essas rotas
# - O script JavaScript injetado no nginx já corrige os redirecionamentos via pushState
# - Se no futuro houver redirecionamentos HTTP, adicione ProxyPassReverse conforme necessário

