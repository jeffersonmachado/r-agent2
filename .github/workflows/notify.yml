# WORKFLOW: Notificacoes de CI/CD.
name: Notificações CI/CD

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        description: 'Nome do workflow referenciado'
        required: false
        default: 'manual'
      workflow_status:
        description: 'Status a reportar'
        required: false
        default: 'unknown'
      branch:
        description: 'Branch associada'
        required: false
        default: 'unknown'
      commit_sha:
        description: 'Commit associado'
        required: false
        default: 'unknown'
      details_url:
        description: 'URL opcional com detalhes da execução'
        required: false
        default: ''
      email_enabled:
        description: 'Emitir placeholder de email'
        required: false
        default: 'false'

jobs:
  notify:
    name: Enviar Notificações
    runs-on: ubuntu-latest
    
    steps:
      - name: Resumo da execução
        run: |
          echo "## 📢 Notificação de CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.event.inputs.workflow_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ github.event.inputs.workflow_status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.event.inputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.details_url }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[Ver detalhes](${{ github.event.inputs.details_url }})" >> $GITHUB_STEP_SUMMARY
          fi
      
      # Notificação via Email (placeholder)
      - name: Notificar Email
        if: ${{ github.event.inputs.email_enabled == 'true' }}
        run: |
          echo "📧 Notificação por email (configurar conforme necessário)"
          echo "Workflow: ${{ github.event.inputs.workflow_name }}"
          echo "Status: ${{ github.event.inputs.workflow_status }}"
        continue-on-error: true

