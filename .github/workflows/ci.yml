name: CI - Testes e Validação

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Job 1: Testes Unitários
  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Executar testes unitários
        run: npm run test:unit
      
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unit
          name: unit-tests
          fail_ci_if_error: false

  # Job 2: Validação Estrutural
  flow-validation:
    name: Validação Estrutural
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Validar estrutura de fluxos
        run: npm run test:flow

  # Job 3: Gate de Dados (Pipeline completo)
  data-pipeline:
    name: Pipeline de Dados
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Seed de dados de teste
        run: npm run seed:test
      
      - name: Gate de dados (validação)
        run: npm run test:data
      
      - name: Testes de scripts
        run: npm run test:scripts
        continue-on-error: true

  # Job 4: Testes RPA (modo CI)
  rpa-tests:
    name: Testes RPA (CI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Instalar Playwright
        run: npx playwright install chromium --with-deps
      
      - name: Executar testes RPA
        run: npm run test:rpa
        continue-on-error: true
      
      - name: Upload relatórios RPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-test-reports
          path: tests/rpa/reports/*.json
          retention-days: 30
          if-no-files-found: ignore

  # Job 5: Build (verificar se compila)
  build-check:
    name: Verificação de Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Verificar build da API
        run: |
          cd api
          node --check server.js || true
      
      - name: Verificar build do Frontend
        run: |
          cd frontend
          npm ci
          npm run build || echo "Build check - frontend pode precisar de ajustes"
        continue-on-error: true

  # Job 6: Resumo e Notificação
  ci-summary:
    name: Resumo CI
    runs-on: ubuntu-latest
    needs: [unit-tests, flow-validation, data-pipeline, rpa-tests, build-check]
    if: always()
    
    steps:
      - name: Resumo dos resultados
        run: |
          echo "## 📊 Resumo da Execução CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Testes Unitários | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validação Estrutural | ${{ needs.flow-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline de Dados | ${{ needs.data-pipeline.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Testes RPA | ${{ needs.rpa-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Check | ${{ needs.build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.flow-validation.result }}" != "success" ] || \
             [ "${{ needs.data-pipeline.result }}" != "success" ]; then
            echo "❌ **Pipeline falhou em etapas críticas**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Pipeline passou com sucesso**" >> $GITHUB_STEP_SUMMARY
          fi

