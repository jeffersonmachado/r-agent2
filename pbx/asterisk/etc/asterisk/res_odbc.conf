[asterisk_pg]
enabled => yes
dsn => asterisk_pg
pre-connect => yes
connect_timeout => 5
negative_connection_cache => 10

; `username`/`password` foram REMOVIDOS daqui de propósito (2026-09-12).
;
; Motivo: essas chaves, quando presentes, são passadas ao SQLConnect e SOBREPÕEM as
; credenciais do `odbc.ini`. Como o `odbc.ini` agora pode ser renderizado por ambiente
; (`pbx/asterisk/etc/odbc.ini.template`, ver serviço `asterisk` no docker-compose.yml),
; manter credenciais fixas aqui tornava a configuração incoerente: o DSN apontava para um
; banco e autenticava com o usuário de outro, falhando de forma silenciosa (o backend CDR
; descarta a linha sem erro visível na aplicação).
;
; Sem `username`/`password`, o unixODBC resolve a autenticação pelas chaves
; `Username`/`Password` do próprio DSN — uma fonte única de verdade, dirigida por ambiente,
; e sem credenciais em texto claro no repositório.

