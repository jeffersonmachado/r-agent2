# WORKFLOW OFICIAL: Stack Docker Compose — valida test-stack-up/smoke/rpa-seed.
name: Stack Test (Docker Compose) [OFICIAL]

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      enable_trace:
        description: 'Habilitar Playwright tracing (RPA_TRACE=1)'
        required: false
        default: '0'
      capture_http_errors:
        description: 'Capturar respostas HTTP>=400 no RPA (RPA_CAPTURE_HTTP_ERRORS=1)'
        required: false
        default: '1'

permissions:
  contents: read
  packages: write

jobs:
  prewarm-images:
    name: Prewarm imagens de teste (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    outputs:
      test_image_prefix: ${{ steps.vars.outputs.test_image_prefix }}
      test_image_tag: ${{ steps.vars.outputs.test_image_tag }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Definir prefix/tag de imagens
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          TEST_IMAGE_PREFIX="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-test"
          TEST_IMAGE_TAG="ci-${SHORT_SHA}"
          echo "test_image_prefix=${TEST_IMAGE_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "test_image_tag=${TEST_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "TEST_IMAGE_PREFIX=${TEST_IMAGE_PREFIX}" >> "$GITHUB_ENV"
          echo "TEST_IMAGE_TAG=${TEST_IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build imagens pré-aquecidas
        run: |
          TEST_IMAGE_PREFIX="${TEST_IMAGE_PREFIX}" TEST_IMAGE_TAG="${TEST_IMAGE_TAG}" bash ./scripts/prewarm-test-images.sh build

      - name: Push imagens pré-aquecidas
        run: |
          TEST_IMAGE_PREFIX="${TEST_IMAGE_PREFIX}" TEST_IMAGE_TAG="${TEST_IMAGE_TAG}" bash ./scripts/prewarm-test-images.sh push

  stack-autotest:
    name: Autotest com stack completa
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [prewarm-images]
    if: |
      always() &&
      (needs.prewarm-images.result == 'success' || needs.prewarm-images.result == 'skipped')

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Instalar dependências (root)
        run: npm ci

      - name: Instalar Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Login no GHCR (autotest)
        if: needs.prewarm-images.result == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rodar autotest com stack (Compose)
        env:
          RPA_TRACE: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_trace || '0' }}
          RPA_CAPTURE_HTTP_ERRORS: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_http_errors || '1' }}
          BUSINESS_QA_MODE: pr
          BILLING_SANDBOX: '1'
          TEST_IMAGE_PREFIX: ${{ needs.prewarm-images.outputs.test_image_prefix || 'r-agent2' }}
          TEST_IMAGE_TAG: ${{ needs.prewarm-images.outputs.test_image_tag || 'test' }}
          STACK_PULL_IMAGES: ${{ needs.prewarm-images.result == 'success' && '1' || '0' }}
          STACK_NO_BUILD: ${{ needs.prewarm-images.result == 'success' && '1' || '0' }}
        run: |
          bash ./scripts/system-autotest-stack.sh
          npm run qa:mesh

      - name: Upload test artifacts (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-junit
          path: |
            frontend/test-results/junit.xml
            rag-service/test-results/junit.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload RPA artifacts (reports/replay/screenshots/traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-artifacts-stack
          path: |
            tests/rpa/reports/**/*.json
            tests/rpa/reports/**/*.md
            tests/rpa/replay/**/*.json
            tests/rpa/screenshots/**/*.png
            tests/rpa/traces/**/*.zip
          retention-days: 7
          if-no-files-found: ignore
