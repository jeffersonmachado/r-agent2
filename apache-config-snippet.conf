# ============================================================================
# CONFIGURAÇÃO PARA ADICIONAR NO ARQUIVO: /etc/httpd/conf.d/results-le-ssl.conf
# (ou /etc/apache2/sites-available/results-le-ssl.conf, dependendo da distribuição)
# ============================================================================
#
# Servidor Docker: 10.10.2.30:8086
# Servidor Apache: 10.10.2.55
#
# Adicione estas linhas dentro do VirtualHost 127.0.0.1:443 do results.com.br,
# após a configuração do n8n e antes das outras rotas (suporte, egroupware, etc.)
#
# ============================================================================

# Rota principal para r-agent2 (frontend + API)
# IMPORTANTE: Tudo relacionado ao r-agent2 deve ter o prefixo /r-agent2/
ProxyPass        "/r-agent2/"  "http://10.10.2.30:8086/" nocanon
ProxyPassReverse "/r-agent2/"  "http://10.10.2.30:8086/"

# Assets do r-agent2 (arquivos JS, CSS, etc.)
# IMPORTANTE: Apenas assets do r-agent2, não global /assets/ (outros serviços usam /assets/)
ProxyPass        "/r-agent2/assets/"  "http://10.10.2.30:8086/assets/" nocanon
ProxyPassReverse "/r-agent2/assets/"  "http://10.10.2.30:8086/assets/"

# Imagens do r-agent2
# IMPORTANTE: Apenas imagens do r-agent2, não global /images/ (outros serviços podem usar /images/)
ProxyPass        "/r-agent2/images/"  "http://10.10.2.30:8086/images/" nocanon
ProxyPassReverse "/r-agent2/images/"  "http://10.10.2.30:8086/images/"

# Garante que os cookies e headers sejam preservados
# IMPORTANTE: Isso ajusta o caminho dos cookies para funcionar corretamente com o prefixo /r-agent2/
ProxyPassReverseCookiePath "/" "/r-agent2/"

# NOTA: Não são necessárias linhas ProxyPassReverse para /login, /dashboard, /support porque:
# - O frontend é uma SPA React que usa redirecionamentos JavaScript (não HTTP)
# - Não há redirecionamentos HTTP do servidor (301/302) para essas rotas
# - O script JavaScript injetado no nginx já corrige os redirecionamentos via pushState
# 
# IMPORTANTE: O nginx do frontend foi configurado para reescrever URLs de assets no HTML
# de /assets/ para /r-agent2/assets/ usando sub_filter, então os assets serão
# corretamente proxyados apenas quando vierem de requisições do r-agent2

