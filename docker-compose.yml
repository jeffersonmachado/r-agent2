version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: chatbot-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-3000}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-tenant-demo}
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: chatbot-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # VITE_API_BASE_URL vazio para usar URLs relativas (proxy nginx)
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped


