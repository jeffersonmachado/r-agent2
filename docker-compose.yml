version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: chatbot-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-3000}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-tenant-demo}
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: chatbot-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # VITE_API_BASE_URL vazio para usar URLs relativas (proxy nginx)
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  rag-service:
    build:
      context: ./rag-service
      dockerfile: ./Dockerfile
    container_name: chatbot-rag-service
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: ${RAG_DEBUG:-false}
      EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      CHUNK_STRATEGY: ${RAG_CHUNK_STRATEGY:-sentence}
      VECTOR_STORE_TYPE: ${RAG_VECTOR_STORE_TYPE:-faiss}
      VECTOR_STORE_PATH: /app/data/vector_store
      LLM_PROVIDER: ${RAG_LLM_PROVIDER:-openai}
      LLM_MODEL: ${RAG_LLM_MODEL:-gpt-3.5-turbo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${RAG_PORT:-8000}:8000"
    volumes:
      - rag-vector-store:/app/data/vector_store
    restart: unless-stopped

volumes:
  rag-vector-store:


