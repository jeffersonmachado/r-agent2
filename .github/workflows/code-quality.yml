name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Job 1: Verificação de código (placeholder para lint)
  code-check:
    name: Verificação de Código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Verificar sintaxe JavaScript
        run: |
          echo "🔍 Verificando sintaxe de arquivos JavaScript..."
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./frontend/node_modules/*" -exec node --check {} \;
      
      - name: Verificar arquivos JSON
        run: |
          echo "🔍 Verificando arquivos JSON..."
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./frontend/node_modules/*" -exec sh -c 'node -e "JSON.parse(require(\"fs\").readFileSync(\"$1\", \"utf8\"))" -- "$1"' _ {} \;
      
      - name: Verificar tamanho de arquivos
        run: |
          echo "📊 Verificando tamanho de arquivos..."
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./frontend/node_modules/*" -exec wc -l {} \; | sort -rn | head -20
      
      - name: Resumo
        run: |
          echo "## 📋 Resumo de Qualidade de Código" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Verificações realizadas:" >> $GITHUB_STEP_SUMMARY
          echo "- Sintaxe JavaScript" >> $GITHUB_STEP_SUMMARY
          echo "- Validação JSON" >> $GITHUB_STEP_SUMMARY
          echo "- Análise de tamanho de arquivos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Para lint completo, considere adicionar ESLint" >> $GITHUB_STEP_SUMMARY

  # Job 2: Análise de segurança (opcional)
  security-scan:
    name: Análise de Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Verificar dependências vulneráveis
        continue-on-error: true
        run: |
          echo "🔒 Verificando vulnerabilidades conhecidas..."
          npm audit --audit-level=moderate
      
      - name: Resumo de segurança
        if: always()
        run: |
          echo "## 🔒 Resumo de Segurança" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Verificação de dependências realizada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Para análise completa, considere:" >> $GITHUB_STEP_SUMMARY
          echo "- Snyk" >> $GITHUB_STEP_SUMMARY
          echo "- Dependabot" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Security Advisories" >> $GITHUB_STEP_SUMMARY

  frontend-tests:
    name: Frontend - Testes (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências (frontend)
        run: |
          cd frontend
          npm ci

      - name: Rodar testes (junit + coverage)
        run: |
          cd frontend
          npm test -- --run --coverage || (echo "⚠️ Retentando testes frontend uma vez..." && npm test -- --run --coverage)

      - name: Upload artifacts (JUnit + Coverage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-artifacts
          path: |
            frontend/test-results/junit.xml
            frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  rag-tests:
    name: RAG Service - Testes (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            rag-service/requirements.txt

      - name: Instalar dependências (rag-service)
        run: |
          python -m pip install --upgrade pip
          pip install -r rag-service/requirements.txt

      - name: Rodar testes (junit + coverage)
        run: |
          mkdir -p rag-service/test-results
          pytest rag-service --junitxml=rag-service/test-results/junit.xml --cov=rag-service --cov-report=html:rag-service/htmlcov --cov-report=term

      - name: Upload artifacts (JUnit + Coverage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-test-artifacts
          path: |
            rag-service/test-results/junit.xml
            rag-service/htmlcov/
          retention-days: 7
          if-no-files-found: ignore

  system-tests:
    name: System - Gate (npm run test:system)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Instalar dependências (root)
        run: npm ci

      - name: Rodar gate sistêmico
        run: npm run test:system

