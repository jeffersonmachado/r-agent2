# Stack de TESTE (reprodutível) para auto-test.
# Objetivo: subir API + Frontend (Vite) + RAG + Postgres + Redis com portas
# alinhadas aos defaults do RPA:
# - API: http://localhost:${API_TEST_PORT:-13001}
# - Frontend: http://localhost:${FRONTEND_TEST_PORT:-15173}
# - RAG: http://localhost:${RAG_TEST_PORT:-18001} (mapeia para 8000 no container)

# Isola labels, redes e volumes da stack oficial/prod. Sem um nome explícito,
# o Compose deriva o projeto do diretório ("r-agent2") e pode reconciliar os
# serviços de docker-compose.prod.yml como se pertencessem à stack de teste.
name: r-agent2-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: r-agent2-postgres-test
    environment:
      POSTGRES_USER: results_app
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nao definida — stack de teste gera efemero via scripts/test-stack-up.sh}"
      POSTGRES_DB: results_saas_test
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - r-agent2-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U results_app -d results_saas_test"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    build:
      context: ./redis
      dockerfile: ./Dockerfile
    image: ${TEST_IMAGE_PREFIX:-r-agent2}-redis:${TEST_IMAGE_TAG:-test}
    container_name: r-agent2-redis-test
    ports:
      - "6380:6379"
    volumes:
      - r-agent2-redis-test-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rag-service:
    build:
      context: ./rag-service
      dockerfile: ./Dockerfile
    image: ${TEST_IMAGE_PREFIX:-r-agent2}-rag-service:${TEST_IMAGE_TAG:-test}
    container_name: r-agent2-rag-service-test
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      RAG_ENVIRONMENT: test
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-test-rag-internal-token-at-least-32-bytes}
      DEBUG: "false"
      VECTOR_STORE_TYPE: postgres
      RAG_DATA_ROOT: /var/lib/ragent2/rag
      VECTOR_STORE_PATH: /var/lib/ragent2/rag/vector_store
      ADAPTIVE_LEARNING_DATA_PATH: /var/lib/ragent2/rag/adaptive_learning
      DATABASE_URL: postgresql://results_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nao definida}@postgres:5432/results_saas_test
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Achado real ao rodar o pipeline de convergência de governança: mesmo com o modelo de
      # embeddings pré-baixado no build (Dockerfile), a biblioteca huggingface_hub por padrão
      # tenta validar/checar a versão online no warm-up de startup — sem acesso à rede do
      # container em runtime, isso trava em retries por minutos até o healthcheck falhar
      # (unhealthy). Modo offline força o uso do cache local do build, sem tentar rede.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "${RAG_TEST_PORT:-18001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - r-agent2-rag-runtime-test:/var/lib/ragent2/rag
      - ./rag-service/test-results:/test-results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
      args:
        API_BASE_IMAGE: ${TEST_API_BASE_IMAGE:-r-agent2-api-base:test}
    image: ${TEST_IMAGE_PREFIX:-r-agent2}-api:${TEST_IMAGE_TAG:-test}
    container_name: r-agent2-api-test
    environment:
      NODE_ENV: test
      API_PORT: 3001
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
      RAG_SERVICE_URL: http://rag-service:8000
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-test-rag-internal-token-at-least-32-bytes}
      DATABASE_URL: postgresql://results_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nao definida}@postgres:5432/results_saas_test
      PGHOST: postgres
      PGUSER: results_app
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nao definida}"
      PGDATABASE: results_saas_test
      PGPORT: 5432
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-test-only-not-secure}
      # Bootstrap de usuários alinhado ao default do RPA (tests/rpa/rpa.config.json)
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123
      ADMIN_USERNAME: admin
      ADMIN_NAME: Admin
      SYSTEMADMIN_EMAIL: systemadmin@example.com
      SYSTEMADMIN_PASSWORD: admin123
      SYSTEMADMIN_USERNAME: systemadmin
      SYSTEMADMIN_NAME: System Admin
      RPA_TOKEN: ${RPA_TOKEN:-}
      WWEBJS_AUTH_PATH: /var/lib/ragent2/whatsapp/auth
      QA_MESH_HISTORY_DIR: /var/lib/ragent2/qa-mesh/history
      QA_MESH_EVIDENCE_DIR: /var/lib/ragent2/qa-mesh/evidence
      QA_MESH_SYSTEM_VALIDATE_DIR: /var/lib/ragent2/qa-mesh/system-validate
      RELEASE_EVIDENCE_BASE_DIR: /var/lib/ragent2/release-evidence
      AMI_HOST: asterisk
      AMI_PORT: 5038
      AMI_USERNAME: ragent2
      AMI_SECRET: "${AMI_SECRET:?Erro: AMI_SECRET não definida (scripts/test-stack-up.sh gera um efêmero)}"
      AMI_ORIGINATE_ENABLED: "true"
      PBX_MEDIA_DIR: /app/api/data/pbx-media
      PBX_RECORDINGS_DIR: /app/api/data/pbx-recordings
      PBX_RECORDING_ENABLED: "true"
      PBX_MIXMONITOR_DIR: /var/spool/asterisk/monitor/pbx
    ports:
      - "${API_TEST_PORT:-13001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health/ready', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - r-agent2-api-runtime-test:/var/lib/ragent2
      - r-agent2-pbx-media-test-data:/app/api/data/pbx-media
      - r-agent2-pbx-recordings-test-data:/app/api/data/pbx-recordings
      - ./tests/rpa/config:/app/tests/rpa/config:ro

  asterisk:
    build:
      context: ./pbx/asterisk
      dockerfile: ./Dockerfile
    image: ${TEST_IMAGE_PREFIX:-r-agent2}-asterisk:${TEST_IMAGE_TAG:-test}
    container_name: r-agent2-asterisk-test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pbx/asterisk/etc/asterisk:/etc/asterisk-static:ro
      - ./pbx/asterisk/etc/odbc.test.ini:/etc/odbc.ini:ro
      - ./pbx/asterisk/etc/odbc.ini.template:/etc/asterisk-odbc.template:ro
      - ./pbx/asterisk/etc/odbcinst.ini:/etc/odbcinst.ini:ro
      - r-agent2-pbx-media-test-data:/var/lib/asterisk/sounds/pbx
      - r-agent2-pbx-recordings-test-data:/var/spool/asterisk/monitor/pbx
      # /etc/asterisk gravável só na memória do container: o start renderiza o
      # manager.conf do template (segredo + ACL no mesmo bloco) antes de subir.
      # mode 1777 é obrigatório: o processo roda como usuário asterisk.
      - type: tmpfs
        target: /etc/asterisk
        tmpfs:
          mode: 0o1777
    environment:
      NODE_ENV: test
      # Mesma origem da API de teste: AMI_SECRET efêmero gerado pelo
      # scripts/test-stack-up.sh; o manager.conf é renderizado em runtime.
      AMI_SECRET: "${AMI_SECRET:?Erro: AMI_SECRET não definida (scripts/test-stack-up.sh gera um efêmero)}"
      # ACL do AMI: MESMA variável que fixa a subnet da rede default (fim do
      # arquivo) — divergência derruba o login da própria API de teste.
      AMI_ACL_PLATFORM_NET: "${RAP_TEST_PLATFORM_SUBNET:-172.30.0.0/16}"
      # Achado real (pipeline de convergência de governança): odbc.test.ini tem
      # "Password=StrongPass" fixo no repositório — quando POSTGRES_PASSWORD real do .env é
      # diferente, a conexão ODBC do Asterisk falha silenciosamente (só visível via
      # `asterisk -rx "odbc show all"`, nunca nos logs docker), e NENHUM CDR real de chamada
      # é gravado em pbx_cdr (só CDRs sintéticos inseridos programaticamente por testes).
      # Renderiza o DSN a partir da MESMA senha real usada pela API/Postgres de teste.
      PBX_ODBC_HOST: postgres
      PBX_ODBC_PORT: "5432"
      PBX_ODBC_DB: results_saas_test
      PBX_ODBC_USER: results_app
      PBX_ODBC_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nao definida}"
    command: ["sh", "/usr/local/bin/asterisk-start"]
    ports:
      - "5060:5060/udp"
      # AMI é protocolo de CONTROLE: mesmo no stack de teste, publicar só no
      # loopback do host (fail-closed), nunca em 0.0.0.0.
      - "127.0.0.1:5038:5038"
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    image: node:22-bookworm-slim
    container_name: r-agent2-frontend-test
    working_dir: /app/frontend
    environment:
      NODE_ENV: test
      FRONTEND_PORT: ${FRONTEND_TEST_PORT:-15173}
      VITE_PROXY_TARGET: http://api:3001
      # Para o Vite falar com a API do host (Playwright roda no host):
      # o frontend é servido em http://localhost:${FRONTEND_TEST_PORT:-15173},
      # e faz chamadas para http://localhost:${API_TEST_PORT:-13001}
      VITE_API_BASE_URL: http://localhost:${API_TEST_PORT:-13001}
    volumes:
      - ./:/app
    ports:
      - "${FRONTEND_TEST_PORT:-15173}:${FRONTEND_TEST_PORT:-15173}"
    depends_on:
      api:
        condition: service_healthy
    command: sh -c "npm ci && npm run start -- --host 0.0.0.0 --port ${FRONTEND_TEST_PORT:-15173} --strictPort"

volumes:
  r-agent2-postgres-test-data:
  r-agent2-redis-test-data:
  r-agent2-api-runtime-test:
  r-agent2-rag-runtime-test:
  r-agent2-pbx-media-test-data:
  r-agent2-pbx-recordings-test-data:

# Subnet pinada: a ACL do AMI (manager.conf.template, ${AMI_ACL_PLATFORM_NET})
# autoriza EXATAMENTE esta rede — a mesma variável alimenta os dois lados.
# Sobrescrever RAP_TEST_PLATFORM_SUBNET quando a default (172.30) já estiver
# ocupada por outra stack na mesma máquina.
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${RAP_TEST_PLATFORM_SUBNET:-172.30.0.0/16}
