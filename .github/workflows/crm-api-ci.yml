name: CRM API CI-CD Pipeline
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'api/**'
      - '.github/workflows/crm-api-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'api/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run CRM unit tests
        run: npm run test:crm --if-present
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: crm_test
          DB_USER: crm_user
          DB_PASSWORD: crm_pass

      - name: Run CRM integration tests
        run: npm run test:crm:integration --if-present
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: crm_test
          DB_USER: crm_user
          DB_PASSWORD: crm_pass

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CRM API
        run: npm run build --if-present

      - name: Create artifact
        run: |
          mkdir -p dist
          cp -r api dist/
          cp package.json dist/
          cp package-lock.json dist/
          zip -r crm-api-${{ github.sha }}.zip dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: crm-api-build
          path: crm-api-${{ github.sha }}.zip
          retention-days: 7

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying CRM API to staging environment..."
          # Add your deployment script here
          # Example: npm run deploy:staging

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    environment: production
    
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying CRM API to production environment..."
          # Add your deployment script here
          # Example: npm run deploy:prod
